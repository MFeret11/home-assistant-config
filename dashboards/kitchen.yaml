kiosk_mode:
  user_settings:
    - users:
        - Kitchen Display
      hide_header: true
      hide_sidebar: true
views:
  # Live page. sensor.kitchen_display_mode (packages/kitchen_display.yaml) picks
  # the layout: "morning" on weekdays 6-9 AM shows only commute, weather and
  # today's events; "day" shows the rest. Cards are in components/shared/.
  - title: Kitchen Kiosk
    path: kitchen-kiosk
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: binary_sensor.weather_alert_showing
            state: "on"
        cards:
          - !include components/shared/weather_alert.yaml
      # Attention chips (vacuum, printer, batteries, cameras, stair door);
      # hidden, with no gap, when there's nothing.
      - &attention_row
        type: grid
        column_span: 2
        visibility:
          - condition: numeric_state
            entity: sensor.house_attention
            above: 0
        cards:
          - !include components/shared/attention.yaml
      - type: grid
        visibility: &morning
          - condition: state
            entity: sensor.kitchen_display_mode
            state: morning
        cards: !include components/shared/morning_left.yaml
      - type: grid
        visibility: *morning
        cards: !include components/shared/morning_right.yaml
      # state_not, so an unknown mode falls back to the full layout.
      - type: grid
        visibility: &day
          - condition: state
            entity: sensor.kitchen_display_mode
            state_not: morning
        cards: !include components/shared/day_left.yaml
      - type: grid
        visibility: *day
        cards: !include components/shared/day_right.yaml

  # ---------------------------------------------------------------------------
  # PREVIEWS of the time-of-day layout (cards in components/shared/). Each shows
  # one mode regardless of the clock. The commute cards still follow their own
  # time windows, so they only appear at commute times.
  # ---------------------------------------------------------------------------
  - title: Preview Morning
    path: preview-morning
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: binary_sensor.weather_alert_showing
            state: "on"
        cards:
          - !include components/shared/weather_alert.yaml
      - *attention_row
      - type: grid
        cards: !include components/shared/morning_left.yaml
      - type: grid
        cards: !include components/shared/morning_right.yaml

  - title: Preview Day
    path: preview-day
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: binary_sensor.weather_alert_showing
            state: "on"
        cards:
          - !include components/shared/weather_alert.yaml
      - *attention_row
      - type: grid
        cards: !include components/shared/day_left.yaml
      - type: grid
        cards: !include components/shared/day_right.yaml
