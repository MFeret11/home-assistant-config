# Today's events, morning only. Always shown (an empty day says so), except on
# Fridays, when weekend_events.yaml shows today along with the weekend.
type: markdown
content: >-
  {% from 'kitchen.jinja' import today_events %}### Today

  {{ today_events(6) }}
visibility:
  - condition: time
    weekdays: [mon, tue, wed, thu, sat, sun]
grid_options:
  columns: full
  rows: auto
card_mod:
  style:
    .: |
      ha-card {
        padding: 14px 20px;
        font-size: 22px;
        line-height: 1.5;
      }
    # Headings and tables sit inside ha-markdown's shadow root.
    ha-markdown $: |
      h3 { font-size: 18px !important; margin: 0 0 4px 0 !important; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
      # Keyword and countdown icons (kitchen.jinja event_icon()).
      p ha-icon { --mdc-icon-size: 22px; vertical-align: -3px; opacity: 0.85; }
