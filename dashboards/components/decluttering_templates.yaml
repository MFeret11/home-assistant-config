# Shared AVR Master Volume Slider (used by header + remote popup)
avr_volume_slider:
  default:
    - name: Master Audio
    - icon: mdi:surround-sound
    - margin: 4px 0 2px 0
  card:
    type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: media_player.theater_receiver
    name: "[[name]]"
    icon: "[[icon]]"
    show_state: true
    tap_action: { action: none }
    button_action:
      tap_action: { action: none }
      double_tap_action: { action: none }
      hold_action: { action: none }
    sub_button:
      - icon: mdi:volume-minus
        tap_action:
          action: perform-action
          perform_action: pyscript.theater_volume_down
          haptic: light
      - icon: mdi:volume-plus
        tap_action:
          action: perform-action
          perform_action: pyscript.theater_volume_up
          haptic: light
    card_mod:
      style: |
        ha-card {
          margin: [[margin]] !important;
          border-radius: 20px !important;
          background: linear-gradient(135deg, rgba(33, 150, 243, 0.15), rgba(13, 71, 161, 0.08)) !important;
          border: 1px solid rgba(66, 165, 245, 0.3) !important;
        }

# Theater mode pill: four sit in one row (Cinema, Sports, Arcade, Hi-Fi)
theater_mode_button:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: "[[action]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          {% set active = is_state('sensor.theater_mode', '[[mode]]') and is_state('binary_sensor.theater_in_use', 'on') %}
          background: {{ '[[bg_gradient]]' if active else 'rgba(255, 255, 255, 0.03)' }} !important;
          border: {{ '2px solid rgba(255, 255, 255, 0.95) !important; box-shadow: 0 0 14px [[glow_color]], inset 0 1px 1px rgba(255, 255, 255, 0.6);' if active else '1px solid rgba(255, 255, 255, 0.08) !important;' }}
          opacity: {{ '1.0' if active else '0.55' }};
          border-radius: 16px;
          padding: 6px 2px !important;
          margin: 0 !important;
          transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }
        ha-card:active { transform: scale(0.94); opacity: 1.0; }
        ha-card .primary { font-weight: 700 !important; font-size: 0.72rem !important; }
        ha-card mushroom-shape-icon { --shape-size: 30px !important; --icon-size: 18px !important; }
        ha-card mushroom-state-item { --spacing: 4px; }

# Clean Remote App Launch Dock Button
remote_app_button:
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    primary: "[[primary]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: pyscript.launch_app
      data:
        app: "[[app]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          background: [[bg_color]] !important;
          border: 1px solid [[border_color]] !important;
          border-radius: 18px;
          padding: 6px 4px !important;
        }
        ha-card:active { transform: scale(0.92); }
        ha-card .primary { font-size: 0.75rem !important; font-weight: 700 !important; }

# Clean Remote Directional D-Pad Button
# (defaults replace the unsupported [[var|default]] pipe syntax)
remote_dpad_button:
  default:
    - icon_color: blue
    - radius: 24px
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target:
        entity_id: remote.onn_pro
      data:
        command: "[[command]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          background: rgba(255, 255, 255, 0.06) !important;
          border: 1px solid rgba(255, 255, 255, 0.12) !important;
          border-radius: [[radius]];
        }
        ha-card:active { transform: scale(0.92); }

# Transparent D-Pad Spacer Card
spacer_card:
  card:
    type: custom:mushroom-template-card
    card_mod:
      style: >
        ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }

# Theme pill in the Themes pop-up. [[entity]] is a library slot
# (pyscript.basement_theme_slot_N) that basement.py fills with whichever theme
# matches the search: its name, icon and swatch colors. Idle, a strip of the
# theme's colors runs along the bottom; the theme in use (Social Mode) fills with
# them and glows. Tap paints it; hold opens the editor on it.
theme_slot_pill:
  card:
    type: custom:mushroom-template-card
    primary: "{{ state_attr('[[entity]]', 'name') }}{{ ' ✎' if state_attr('[[entity]]', 'edited') else '' }}"
    icon: "{{ state_attr('[[entity]]', 'icon') or 'mdi:palette' }}"
    icon_color: "{{ (state_attr('[[entity]]', 'swatch') or ['255, 193, 7'])[0] }}"
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: pyscript.select_theme_slot
      data:
        slot: "[[slot]]"
      haptic: light
    hold_action:
      action: perform-action
      perform_action: pyscript.edit_theme_slot
      data:
        slot: "[[slot]]"
      haptic: medium
    card_mod:
      style: |
        {% set sw = state_attr('[[entity]]', 'swatch') or ['255, 255, 255'] %}
        {% set active = states('sensor.basement_palette') == state_attr('[[entity]]', 'palette_id') and is_state('input_select.basement_lighting_mode', 'Social Mode') %}
        {% set ns = namespace(strip=[], fill=[]) %}
        {% for c in sw %}
          {% set a = (loop.index0 * 100 / sw | length) | round(1) %}
          {% set b = (loop.index * 100 / sw | length) | round(1) %}
          {% set ns.strip = ns.strip + ['rgba(' ~ c ~ ', 0.9) ' ~ a ~ '% ' ~ b ~ '%'] %}
          {% set ns.fill = ns.fill + ['rgba(' ~ c ~ ', 0.38)'] %}
        {% endfor %}
        {% set fill = ns.fill if ns.fill | length > 1 else ns.fill + ns.fill %}
        ha-card {
          height: 36px !important;
          min-height: 36px !important;
          padding: 0 8px !important;
          --spacing: 0px !important;
          --mush-spacing: 0px !important;
          border-radius: 14px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          overflow: hidden !important;
          contain: content !important;
          box-sizing: border-box !important;
          transition: all 0.2s ease !important;
        {% if active %}
          background: linear-gradient(135deg, {{ fill | join(', ') }}) !important;
          background-size: 200% 200% !important;
          border: 1.5px solid rgba({{ sw[0] }}, 0.95) !important;
          box-shadow: 0 0 14px rgba({{ sw[0] }}, 0.5) !important;
          animation: moodShift 5s ease-in-out infinite;
        {% else %}
          background: linear-gradient(90deg, {{ ns.strip | join(', ') }}) bottom / 100% 3px no-repeat, rgba(255, 255, 255, 0.05) !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
          box-shadow: none !important;
          animation: none;
        {% endif %}
        }
        @keyframes moodShift {
          0%   { background-position: 0% 50%;   box-shadow: 0 0 10px rgba({{ sw[0] }}, 0.45); }
          50%  { background-position: 100% 50%; box-shadow: 0 0 20px rgba({{ sw[0] }}, 0.45); }
          100% { background-position: 0% 50%;   box-shadow: 0 0 10px rgba({{ sw[0] }}, 0.45); }
        }
        ha-card:active { transform: scale(0.94); }
        ha-card .container {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          gap: 6px !important;
          justify-content: center !important;
          align-items: center !important;
        }
        ha-card mushroom-shape-icon {
          --shape-size: 24px !important;
          --icon-size: 16px !important;
          margin: 0 !important;
        }
        ha-card mushroom-state-info {
          flex: 0 1 auto !important;
          min-width: 0 !important;
          padding: 0 !important;
        }
        ha-card .primary {
          font-size: 0.74rem !important;
          font-weight: 600 !important;
          margin: 0 !important;
          line-height: 1.1 !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
        }

# Filter button above the theme pills: All, Moods, Holidays, Mine.
theme_tab_button:
  card:
    type: custom:mushroom-template-card
    primary: "[[name]]"
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: pyscript.select_theme_tab
      data:
        tab: "[[tab]]"
      haptic: light
    card_mod:
      style: |
        {% set active = is_state('pyscript.basement_theme_tab', '[[tab]]') %}
        ha-card {
          height: 30px !important;
          min-height: 30px !important;
          padding: 0 4px !important;
          --spacing: 0px !important;
          --mush-spacing: 0px !important;
          border-radius: 12px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          background: {{ 'rgba(255, 193, 7, 0.18)' if active else 'transparent' }} !important;
          border: 1px solid {{ 'rgba(255, 193, 7, 0.6)' if active else 'rgba(255, 255, 255, 0.08)' }} !important;
          box-shadow: none !important;
        }
        ha-card:active { transform: scale(0.94); }
        ha-card .container { padding: 0 !important; justify-content: center !important; }
        ha-card mushroom-shape-icon { display: none !important; }
        ha-card mushroom-state-info { flex: 0 1 auto !important; padding: 0 !important; }
        ha-card .primary {
          font-size: 0.7rem !important;
          font-weight: {{ 700 if active else 500 }} !important;
          opacity: {{ 1 if active else 0.65 }} !important;
          white-space: nowrap !important;
        }

# One bulb in the theme editor: shows the bulb's own color, tap to change it.
theme_bulb_button:
  card:
    type: custom:mushroom-template-card
    entity: "[[entity]]"
    primary: "[[name]]"
    icon: "[[icon]]"
    icon_color: >-
      {% set rgb = state_attr('[[entity]]', 'rgb_color') %}
      {{ (rgb | join(', ')) if is_state('[[entity]]', 'on') and rgb else 'disabled' }}
    layout: horizontal
    tap_action:
      action: more-info
      haptic: light
    card_mod:
      style: |
        {% set rgb = state_attr('[[entity]]', 'rgb_color') %}
        {% set c = (rgb | join(', ')) if is_state('[[entity]]', 'on') and rgb else '255, 255, 255' %}
        ha-card {
          height: 34px !important;
          min-height: 34px !important;
          padding: 0 6px !important;
          --spacing: 0px !important;
          --mush-spacing: 0px !important;
          border-radius: 12px !important;
          display: flex !important;
          align-items: center !important;
          background: rgba({{ c }}, {{ 0.14 if is_state('[[entity]]', 'on') else 0.03 }}) !important;
          border: 1px solid rgba({{ c }}, {{ 0.5 if is_state('[[entity]]', 'on') else 0.1 }}) !important;
          box-shadow: none !important;
        }
        ha-card:active { transform: scale(0.94); }
        ha-card .container { padding: 0 !important; gap: 4px !important; }
        ha-card mushroom-shape-icon { --shape-size: 22px !important; --icon-size: 14px !important; }
        ha-card mushroom-state-info { min-width: 0 !important; padding: 0 !important; }
        ha-card .primary { font-size: 0.68rem !important; font-weight: 600 !important; white-space: nowrap !important; }

# Clean Remote Transport Button
# (default replaces the unsupported [[haptic|light]] pipe syntax)
remote_transport_button:
  default:
    - haptic: light
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: "[[action]]"
      haptic: "[[haptic]]"
    card_mod:
      style: |
        ha-card {
          background: [[bg_color]] !important;
          border: 1px solid [[border_color]] !important;
          border-radius: 18px;
        }
        ha-card:active { transform: scale(0.92); }

# Announcer Voice Preset 3-Way Segmented Toggle Card
announcer_preset_button:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: pyscript.theater_set_announcer_preset
      data:
        preset: "[[preset]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          {% set active = is_state('input_select.theater_announcer_preset', '[[preset]]') %}
          background: {{ '[[active_bg]]' if active else 'rgba(255, 255, 255, 0.03)' }} !important;
          border: {{ '1.5px solid [[active_border]] !important; box-shadow: 0 0 16px [[active_glow]], inset 0 1px 1px rgba(255, 255, 255, 0.4);' if active else '1px solid rgba(255, 255, 255, 0.08) !important;' }}
          opacity: {{ '1.0' if active else '0.50' }};
          border-radius: 16px !important;
          padding: 8px 4px !important;
          margin: 0 !important;
          transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }
        ha-card:active { transform: scale(0.94); opacity: 1.0; }
        ha-card .primary { font-size: 0.72rem !important; font-weight: 700 !important; }
        ha-card .secondary { font-size: 0.65rem !important; font-weight: 600 !important; margin-top: -2px !important; }
        ha-card mushroom-shape-icon {
          --shape-size: 28px !important;
          --icon-size: 16px !important;
          margin-bottom: 2px !important;
        }

# Lighting Effect Pill (Toast, Eagles): same shape as theme_slot_pill, fires a pyscript effect.
# active_expr is a Jinja expression for when to highlight it; by default it never highlights.
effect_pill:
  default:
    - active_expr: "false"
    - active_bg: transparent
    - active_border: transparent
    - glow: transparent
  card:
    type: custom:mushroom-template-card
    primary: "[[name]]"
    icon: "[[icon]]"
    icon_color: "[[color]]"
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: "[[action]]"
      haptic: medium
    card_mod:
      style: |
        ha-card {
          height: 36px !important;
          min-height: 36px !important;
          padding: 0 8px !important;
          --spacing: 0px !important;
          --mush-spacing: 0px !important;
          border-radius: 14px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          {% set active = [[active_expr]] %}
          background: {{ '[[active_bg]]' if active else '[[idle_bg]]' }} !important;
          border: {{ '1.5px solid [[active_border]]' if active else '1px solid [[idle_border]]' }} !important;
          box-shadow: {{ '0 0 14px [[glow]]' if active else 'none' }} !important;
          transition: all 0.2s ease !important;
        }
        ha-card:active { transform: scale(0.94); }
        ha-card .container {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          gap: 6px !important;
          justify-content: center !important;
          align-items: center !important;
        }
        ha-card mushroom-shape-icon {
          --shape-size: 24px !important;
          --icon-size: 16px !important;
          margin: 0 !important;
        }
        ha-card mushroom-state-info {
          flex: 0 1 auto !important;
          min-width: 0 !important;
          padding: 0 !important;
        }
        ha-card .primary {
          font-size: 0.74rem !important;
          font-weight: 700 !important;
          color: [[text_color]] !important;
        }

# Spotify Playlist Preset (Hi-Fi Lounge jukebox grid)
spotify_preset_button:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: pyscript.theater_play_spotify_playlist
      data:
        uri: "[[uri]]"
      haptic: medium
    card_mod:
      style: |
        ha-card {
          border-radius: 16px !important;
        }
