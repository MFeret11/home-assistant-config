# Universal Liquid Glass Slider
bubble_light_slider:
  card:
    type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    show_state: true
    hold_action:
      action: more-info
      haptic: medium
    card_mod:
      style: |
        ha-card { contain: content !important; margin: 0 !important; border: none !important; background: none !important; }
          .bubble-container {
            border-radius: 20px !important;
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
          }

# Shared AVR Master Volume Slider (used by header + remote popup)
avr_volume_slider:
  default:
    - name: Master Audio
    - icon: mdi:surround-sound
    - margin: 4px 0 2px 0
  card:
    type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: media_player.theater_receiver
    name: "[[name]]"
    icon: "[[icon]]"
    show_state: true
    tap_action: { action: none }
    button_action:
      tap_action: { action: none }
      double_tap_action: { action: none }
      hold_action: { action: none }
    sub_button:
      - icon: mdi:volume-minus
        tap_action:
          action: perform-action
          perform_action: pyscript.theater_volume_down
          haptic: light
      - icon: mdi:volume-plus
        tap_action:
          action: perform-action
          perform_action: pyscript.theater_volume_up
          haptic: light
    card_mod:
      style: |
        ha-card {
          margin: [[margin]] !important;
          border-radius: 20px !important;
          background: linear-gradient(135deg, rgba(33, 150, 243, 0.15), rgba(13, 71, 161, 0.08)) !important;
          border: 1px solid rgba(66, 165, 245, 0.3) !important;
        }

# Theater Mode Grid Card (Cinema, Sports, Arcade, Hi-Fi)
theater_mode_button:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: "[[action]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          {% set active = is_state('sensor.theater_mode', '[[mode]]') and is_state('binary_sensor.theater_in_use', 'on') %}
          background: {{ '[[bg_gradient]]' if active else 'rgba(255, 255, 255, 0.03)' }} !important;
          border: {{ '2px solid rgba(255, 255, 255, 0.95) !important; box-shadow: 0 0 24px [[glow_color]], inset 0 1px 1px rgba(255, 255, 255, 0.6); transform: scale(1.02);' if active else '1px solid rgba(255, 255, 255, 0.08) !important;' }}
          opacity: {{ '1.0' if active else '0.55' }};
          border-radius: 20px;
          padding: 12px 8px !important;
          margin: 0 !important;
          transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }
        ha-card:active { transform: scale(0.94); opacity: 1.0; }
        ha-card .primary { font-weight: 700 !important; }

# Marquee Control Button (Volume Step)
media_control_btn:
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    icon_color: grey
    tap_action:
      action: perform-action
      perform_action: "[[action]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          background: rgba(255, 255, 255, 0.06) !important;
          border: 1px solid rgba(255, 255, 255, 0.12) !important;
          border-radius: 14px !important;
          height: 38px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          padding: 0 !important;
          margin: 0 !important;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25) !important;
          transition: all 0.15s ease !important;
        }
        ha-card:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.14) !important; }
        ha-card mushroom-shape-icon {
          --shape-size: 30px !important;
          --icon-size: 18px !important;
        }

# Marquee Navigation Button (Remote Launcher)
media_nav_btn:
  card:
    type: custom:mushroom-template-card
    icon: mdi:remote
    icon_color: blue
    tap_action:
      action: navigate
      navigation_path: "#remote"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          background: rgba(33, 150, 243, 0.18) !important;
          border: 1px solid rgba(33, 150, 243, 0.5) !important;
          border-radius: 14px !important;
          height: 38px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          padding: 0 !important;
          margin: 0 !important;
          box-shadow: 0 2px 10px rgba(33, 150, 243, 0.25) !important;
          transition: all 0.15s ease !important;
        }
        ha-card:active { transform: scale(0.92); }
        ha-card mushroom-shape-icon {
          --shape-size: 30px !important;
          --icon-size: 18px !important;
        }

# Clean Remote App Launch Dock Button
remote_app_button:
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    primary: "[[primary]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: pyscript.launch_app
      data:
        app: "[[app]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          background: [[bg_color]] !important;
          border: 1px solid [[border_color]] !important;
          border-radius: 18px;
          padding: 6px 4px !important;
        }
        ha-card:active { transform: scale(0.92); }
        ha-card .primary { font-size: 0.75rem !important; font-weight: 700 !important; }

# Clean Remote Directional D-Pad Button
# (defaults replace the unsupported [[var|default]] pipe syntax)
remote_dpad_button:
  default:
    - icon_color: blue
    - radius: 24px
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target:
        entity_id: remote.onn_pro
      data:
        command: "[[command]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          background: rgba(255, 255, 255, 0.06) !important;
          border: 1px solid rgba(255, 255, 255, 0.12) !important;
          border-radius: [[radius]];
        }
        ha-card:active { transform: scale(0.92); }

# Transparent D-Pad Spacer Card
spacer_card:
  card:
    type: custom:mushroom-template-card
    card_mod:
      style: >
        ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }

# Inline Quick Mood Pill for Zone Lighting Drawer (3x2 grid, icon beside label)
quick_mood_pill:
  card:
    type: custom:mushroom-template-card
    primary: "[[name]]"
    icon: "[[icon]]"
    icon_color: "[[color]]"
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: pyscript.select_palette
      data:
        palette: "[[palette_id]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          height: 36px !important;
          min-height: 36px !important;
          padding: 0 8px !important;
          --spacing: 0px !important;
          --mush-spacing: 0px !important;
          border-radius: 14px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          overflow: hidden !important;
          contain: content !important;
          box-sizing: border-box !important;
          {% set active = is_state('sensor.basement_palette', '[[palette_id]]') and is_state('input_select.basement_lighting_mode', 'Social Mode') %}
          background: {{ '[[active_bg]]' if active else 'rgba(255, 255, 255, 0.05)' }} !important;
          border: {{ '1.5px solid [[active_border]]' if active else '1px solid rgba(255, 255, 255, 0.1)' }} !important;
          box-shadow: {{ '0 0 14px [[glow]]' if active else 'none' }} !important;
          transition: all 0.2s ease !important;
          background-size: 200% 200% !important;
          animation: {{ 'moodShift 5s ease-in-out infinite' if active else 'none' }};
        }
        @keyframes moodShift {
          0%   { background-position: 0% 50%;   box-shadow: 0 0 10px [[glow]]; }
          50%  { background-position: 100% 50%; box-shadow: 0 0 20px [[glow]]; }
          100% { background-position: 0% 50%;   box-shadow: 0 0 10px [[glow]]; }
        }
        ha-card:active { transform: scale(0.94); }
        ha-card .container {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          gap: 6px !important;
          justify-content: center !important;
          align-items: center !important;
        }
        ha-card mushroom-shape-icon {
          --shape-size: 24px !important;
          --icon-size: 16px !important;
          margin: 0 !important;
        }
        ha-card mushroom-state-info {
          flex: 0 1 auto !important;
          min-width: 0 !important;
          padding: 0 !important;
        }
        ha-card .primary {
          font-size: 0.74rem !important;
          font-weight: 600 !important;
          margin: 0 !important;
          line-height: 1.1 !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: clip !important;
        }

# Clean Liquid Glass Bubble Switch Card
bubble_switch_card:
  card:
    type: custom:bubble-card
    card_type: button
    button_type: switch
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    show_state: true
    card_mod:
      style: |
        ha-card { contain: content !important; margin: 0 !important; border: none !important; background: none !important; }
          .bubble-container {
            border-radius: 20px !important;
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
          }

# Clean Remote Transport Button
# (default replaces the unsupported [[haptic|light]] pipe syntax)
remote_transport_button:
  default:
    - haptic: light
  card:
    type: custom:mushroom-template-card
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: "[[action]]"
      haptic: "[[haptic]]"
    card_mod:
      style: |
        ha-card {
          background: [[bg_color]] !important;
          border: 1px solid [[border_color]] !important;
          border-radius: 18px;
        }
        ha-card:active { transform: scale(0.92); }

# Announcer Voice Preset 3-Way Segmented Toggle Card
announcer_preset_button:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: perform-action
      perform_action: pyscript.theater_set_announcer_preset
      data:
        preset: "[[preset]]"
      haptic: light
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          {% set active = is_state('input_select.theater_announcer_preset', '[[preset]]') %}
          background: {{ '[[active_bg]]' if active else 'rgba(255, 255, 255, 0.03)' }} !important;
          border: {{ '1.5px solid [[active_border]] !important; box-shadow: 0 0 16px [[active_glow]], inset 0 1px 1px rgba(255, 255, 255, 0.4);' if active else '1px solid rgba(255, 255, 255, 0.08) !important;' }}
          opacity: {{ '1.0' if active else '0.50' }};
          border-radius: 16px !important;
          padding: 8px 4px !important;
          margin: 0 !important;
          transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }
        ha-card:active { transform: scale(0.94); opacity: 1.0; }
        ha-card .primary { font-size: 0.72rem !important; font-weight: 700 !important; }
        ha-card .secondary { font-size: 0.65rem !important; font-weight: 600 !important; margin-top: -2px !important; }
        ha-card mushroom-shape-icon {
          --shape-size: 28px !important;
          --icon-size: 16px !important;
          margin-bottom: 2px !important;
        }
