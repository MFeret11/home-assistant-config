# Shows while the game is live, starts within 24 h, or ended in the last 12 h
# (binary_sensor.phillies_game_soon, packages/sports.yaml).
type: custom:compact-team-tracker
entities:
  - sensor.mlb_philadelphia_phillies
layout: standard
show_day_of_week: true
show_tv_network: true
show_league: false
show_event_name: false
card_mod:
  style: |
    ha-card {
      border-radius: 20px !important;
    }
visibility:
  - condition: state
    entity: binary_sensor.phillies_game_soon
    state: "on"
grid_options:
  columns: full
  rows: auto
