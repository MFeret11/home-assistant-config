# Weather card (daytime: adds the next five days, except while the train-home
# card is showing, so the page still fits one screen). Markup: custom_templates/kitchen.jinja weather_panel().
type: markdown
content: >-
  {% from 'kitchen.jinja' import weather_panel %}{{ weather_panel(not is_state('binary_sensor.kitchen_show_pm_commute', 'on')) }}
grid_options:
  columns: full
  rows: auto
card_mod:
  style:
    .: |
      ha-card {
        padding: 10px 18px;
        text-align: center;
        font-size: 22px;
        color: var(--primary-text-color);
      }
    # Headings and tables sit inside ha-markdown's shadow root.
    ha-markdown $: |
      :host { text-align: center; }
      h1 { font-size: 40px !important; line-height: 1.1 !important; margin: 0 0 4px 0 !important; font-weight: 700; white-space: nowrap; }
      h1 ha-icon { --mdc-icon-size: 40px; vertical-align: -5px; }
      h3 { font-size: 22px !important; margin: 0 0 8px 0 !important; opacity: 0.85; font-weight: 500; }
      p { margin: 6px 0 !important; }
      table { width: 100%; table-layout: fixed; border-collapse: collapse; margin: 10px 0 2px 0; }
      td { text-align: center; border: none !important; padding: 2px 0 !important; font-size: 20px; }
      tr:first-child td { font-size: 16px; opacity: 0.7; }
      td ha-icon { --mdc-icon-size: 40px; }
      tr:last-child td { font-size: 24px; }
      hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 12px 0 4px 0; }
