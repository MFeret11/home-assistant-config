# One chores line from Home Keeper; hidden when nothing is overdue or due today.
type: markdown
visibility:
  - condition: numeric_state
    entity: sensor.home_keeper_tasks
    above: 0
content: >-
  {% from 'kitchen.jinja' import chores_line %}{{ chores_line() }}
grid_options:
  columns: full
  rows: auto
card_mod:
  style: |
      ha-card {
        border-radius: 22px !important;
        background: rgba(255, 255, 255, 0.04) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        backdrop-filter: blur(16px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        padding: 12px 20px;
        font-size: 20px;
      }
