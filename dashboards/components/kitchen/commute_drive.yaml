# The drive to work, kept to one compact line so the train card above stays
# the main thing on the morning page.
type: markdown
content: >-
  🚗 Matt's drive **{{ state_attr('sensor.commute_drive_time',
  'duration_in_traffic') | default('calculating…', true) }}** · normally {{
  state_attr('sensor.commute_drive_time', 'duration')
  | default('—', true) }} · {{ state_attr('sensor.commute_drive_time',
  'distance') | default('—', true) }}
grid_options:
  columns: full
  rows: auto
card_mod:
  style:
    .: >
      ha-card {
        font-size: 18px;
        line-height: 1.3;
        text-align: center;
        padding: 0 12px;
      }
    # The text sits inside ha-markdown's shadow root.
    ha-markdown $: |
      :host { text-align: center; }
      p { margin: 8px 0 !important; }
visibility:
  - condition: state
    entity: binary_sensor.drive_display_window
    state: "on"
  # No drive card on work-from-home days.
  - condition: state
    entity: binary_sensor.working_from_home
    state_not: "on"
