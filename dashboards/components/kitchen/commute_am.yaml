type: markdown
content: >-
  {% set c = states.sensor.septa_commute.attributes if
  states.sensor.septa_commute is not none else {} %}

  {% set w = states.sensor.commute_weather.attributes if
  states.sensor.commute_weather is not none else {} %}

  {% set no_data = c.get('origin_train') is none or
  states('sensor.septa_commute') in ['unavailable', 'unknown', 'error', 'idle'] %}

  {% set orig_track = c.get('origin_track') %}

  {% set track = (' · Track ' ~ orig_track) if (orig_track and
  orig_track != 'TBD') else '' %}

  {% set delay = c.get('total_delay_minutes', 0) or 0 %}

  {% set backup = c.get('backup_train_departure') %}


  {% for a in (c.get('service_alerts') or [])[:2] %}
    🚨 **{{ a | truncate(160) }}**
  {% endfor %}

  {% if no_data %}
    # ⚠️ Train times unavailable

    ### Check SEPTA before heading out
  {% elif c.get('is_cancelled', false) %}
    # ❌ TRAIN CANCELLED

    ### Train {{ c.get('origin_train') }} is cancelled · next train **{{ backup or 'check SEPTA' }}**
  {% elif c.get('connection_cancelled', false) %}
    # ❌ CONNECTION CANCELLED

    ### Train {{ c.get('connection_train') }} at {{ c.get('connection_station') }} is cancelled · next train **{{ backup or 'check SEPTA' }}**
  {% elif c.get('is_stalled', false) %}
    # ⚠️ TRAIN STALLED

    ### Train {{ c.get('origin_train') }} stopped at {{ c.get('origin_current_stop') or 'its last stop' }} (~{{ c.get('stall_minutes', 0) }}m)
  {% elif c.get('connection_is_stalled', false) %}
    # ⚠️ CONNECTION STALLED

    ### Train {{ c.get('connection_train') }} stopped at {{ c.get('connection_current_stop') or 'its last stop' }} (~{{ c.get('connection_stall_minutes', 0) }}m)
  {% elif c.get('rider_on_train') and c.get('rider_on_train') == c.get('origin_train') %}
    # 🚆 On train {{ c.get('origin_train') }}

    ### Arrives **{{ c.get('actual_arrival_time', '—') }}**
  {% elif c.get('leave_now', false) %}
    # 🚨 LEAVE NOW

    ### Train {{ c.get('origin_train') }}{{ track }} departs at **{{ c.get('origin_actual_departure_time', '—') }}**
  {% else %}
    # 🕐 Leave by **{{ c.get('leave_by_time', '—') }}**

    ### Train {{ c.get('origin_train') }}{{ track }} · Departs **{{ c.get('origin_actual_departure_time', '—') }}**
  {% endif %}

  {% if not no_data and not c.get('is_cancelled', false) and not c.get('connection_cancelled', false) %}
    {% if c.get('origin_delay_unknown', false) or c.get('connection_delay_unknown', false) %}
    ⚠️ SEPTA says "{{ c.get('origin_delay_text') if c.get('origin_delay_unknown', false) else c.get('connection_delay_text') }}" for train {{ c.get('origin_train') if c.get('origin_delay_unknown', false) else c.get('connection_train') }}, not a delay estimate. Check SEPTA.
    {% elif c.get('planned_connection_cancelled', false) %}
    ❌ Usual connection (train {{ c.get('planned_connection_train') }}) cancelled · take train {{ c.get('connection_train') }} at {{ c.get('connection_actual_departure_time') }} · arrive {{ c.get('actual_arrival_time') }}
    {% elif c.get('missed_connection', false) %}
    🚨 Misses the planned connection · next is train {{ c.get('connection_train') }} at {{ c.get('connection_actual_departure_time') }} · arrive {{ c.get('actual_arrival_time') }}
    {% elif c.get('at_risk', false) %}
    ⚠️ Tight connection at {{ c.get('connection_station') }} · arrive {{ c.get('actual_arrival_time') }}
    {% elif delay > 0 %}
    {{ '🔴' if delay >= 10 else '🟡' }} {{ delay }} min late · arrive {{ c.get('actual_arrival_time') }}
    {% elif c.get('service_alerts') %}
    SEPTA lists this train on time, but check the alert above · arrive {{ c.get('actual_arrival_time') }}
    {% else %}
    🟢 On time · arrive {{ c.get('actual_arrival_time') }}
    {% endif %}
    {% if backup %}
    Next train after this one: {{ backup }}
    {% endif %}
  {% endif %}

  {% if c.get('transfer_fallback', false) %}
    🔀 No connection at {{ c.get('preferred_transfer_station') }} right now · change at **{{ c.get('connection_station') }}**
  {% endif %}

  {% if c.get('data_stale', false) %}
    ⏳ SEPTA didn't respond just now; times are from a few minutes ago.
  {% endif %}


  {% if w.get('morning_warning') %}
    ---

    ☔ {{ w.get('morning_warning') }}
  {% endif %}
grid_options:
  columns: full
  rows: auto
card_mod:
  style:
    .: >
      ha-card {
        font-size: 22px;
        line-height: 1.35;
        text-align: center;
        padding: 18px 14px;
        {% set level = states('sensor.commute_am_severity') %}
        {% set is_alert = level == 'alert' %}
        {% set is_warn = level == 'warn' %}
        background: {{ 'linear-gradient(135deg, rgba(244, 67, 54, 0.4), rgba(183, 28, 28, 0.2))' if is_alert else ('linear-gradient(135deg, rgba(255, 179, 0, 0.35), rgba(255, 111, 0, 0.18))' if is_warn else 'rgba(255, 255, 255, 0.04)') }} !important;
        border: {{ '2px solid rgba(244, 67, 54, 0.8)' if is_alert else ('1.5px solid rgba(255, 179, 0, 0.7)' if is_warn else '1px solid rgba(255, 255, 255, 0.1)') }} !important;
        box-shadow: {{ '0 6px 24px rgba(244, 67, 54, 0.35)' if is_alert else '0 6px 20px rgba(0, 0, 0, 0.2)' }};
        color: var(--primary-text-color);
      }
    # Headings sit inside ha-markdown's shadow root.
    ha-markdown $: |
      :host { text-align: center; }
      h1 { font-size: 34px !important; margin: 0 0 6px 0 !important; font-weight: 700; }
      h3 { font-size: 22px !important; margin: 0 0 8px 0 !important; opacity: 0.9; }
      hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 10px 0; }
visibility:
  - condition: state
    entity: binary_sensor.septa_am_window
    state: "on"
