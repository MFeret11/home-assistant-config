# Today's events, morning only. Always shown: an empty day says so.
type: markdown
content: >-
  {% from 'kitchen.jinja' import today_events %}### Today

  {{ today_events(6) }}
grid_options:
  columns: full
  rows: auto
card_mod:
  style:
    .: |
      ha-card {
        padding: 14px 20px;
        font-size: 22px;
        line-height: 1.5;
      }
    # Headings and tables sit inside ha-markdown's shadow root.
    ha-markdown $: |
      h3 { font-size: 18px !important; margin: 0 0 4px 0 !important; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
