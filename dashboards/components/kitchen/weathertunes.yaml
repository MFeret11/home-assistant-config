# WeatherTunes widget: today's forecast played as a song, shown right on the
# dashboard; tap the card to play. www/weathertunes/kitchen.html opens the newest
# copy of the page (each version has its own folder, since /local/ files are cached
# by browsers for a month). The Pi renders the song there every morning (cron,
# ~/WeatherTunes/tools/kitchen_render.py), so it plays at once. The folder is
# gitignored because it holds the home forecast. Bump v= if a browser keeps
# showing an old version (HA lets browsers cache /local/ files for a month).
type: iframe
url: /local/weathertunes/kitchen.html?kitchen&widget&v=4
allow: autoplay
# Hidden while Spotify is playing or the train-home card is up: those take
# this slot so the page never needs scrolling. In the morning layout today's
# events come first, so with 3 or more of them the song is hidden too. In the
# day layout the away map (away_map_*.yaml) takes this slot while someone is out.
visibility:
  - condition: or
    conditions:
      - condition: state
        entity: sensor.kitchen_display_mode
        state: morning
      - condition: and
        conditions:
          - condition: state
            entity: binary_sensor.partner_away
            state_not: "on"
          - condition: state
            entity: binary_sensor.me_away
            state_not: "on"
  - condition: or
    conditions:
      - condition: state
        entity: sensor.kitchen_display_mode
        state_not: morning
      - condition: numeric_state
        entity: sensor.kitchen_today_events
        below: 3
  - condition: state
    entity: media_player.whole_house_spotify
    state_not: playing
  - condition: state
    entity: binary_sensor.kitchen_show_pm_commute
    state_not: "on"
grid_options:
  columns: full
  rows: 3
card_mod:
  style: |
      ha-card {
        overflow: hidden;
      }
