type: vertical-stack
card_mod:
  style: |
    #root > * { margin-bottom: 8px !important; }
    #root {
      background: rgba(255, 193, 7, 0.08) !important;
      border: 1px solid rgba(255, 193, 7, 0.3) !important;
      border-radius: 24px !important;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      padding: 12px !important;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }
cards:
  # Zone Lighting Section Header
  - type: custom:mushroom-template-card
    primary: Lighting
    secondary: >-
      {% if is_state('input_select.basement_lighting_mode', 'Social Mode') %}Social • {{ states('sensor.basement_palette') | title }}{% else %}Daily Driver{% endif %} • {{ 'Lights on' if is_state('binary_sensor.basement_lights_active', 'on') else 'Lights off' }}
    icon: mdi:lightbulb-multiple
    icon_color: amber
    layout: horizontal
    card_mod:
      style: |
        ha-card {
          background: none !important;
          border: none !important;
          box-shadow: none !important;
          padding: 0 4px !important;
          margin: 0 0 2px 0 !important;
        }
        ha-card .primary {
          font-size: 0.78rem !important;
          font-weight: 700 !important;
          letter-spacing: 1.2px !important;
          text-transform: uppercase !important;
          opacity: 0.85 !important;
        }
        ha-card .secondary { font-size: 0.7rem !important; opacity: 0.6 !important; }
        ha-card mushroom-shape-icon {
          --shape-size: 24px !important;
          --icon-size: 16px !important;
          --shape-color: transparent !important;
        }

  # --- PALETTES: 2x2 so the names fit on a phone. Tapping one switches to
  # Social Mode with that palette; the header chip toggles Social/Daily Driver.
  - type: grid
    square: false
    columns: 2
    card_mod:
      style: |
        :host {
          margin: 4px 0 0 0 !important;
          display: block !important;
        }
        #root { gap: 4px !important; }
    cards:
      - type: custom:decluttering-card
        template: quick_mood_pill
        variables:
          - name: Speakeasy
          - icon: mdi:glass-cocktail
          - color: amber
          - palette_id: speakeasy
          - active_bg: "linear-gradient(135deg, rgba(245, 158, 11, 0.40), rgba(180, 83, 9, 0.22))"
          - active_border: "rgba(245, 158, 11, 0.95)"
          - glow: "rgba(245, 158, 11, 0.45)"
      - type: custom:decluttering-card
        template: quick_mood_pill
        variables:
          - name: Synthwave
          - icon: mdi:sine-wave
          - color: purple
          - palette_id: synthwave
          - active_bg: "linear-gradient(135deg, rgba(217, 70, 239, 0.45), rgba(134, 25, 143, 0.25))"
          - active_border: "rgba(217, 70, 239, 0.95)"
          - glow: "rgba(217, 70, 239, 0.55)"
      - type: custom:decluttering-card
        template: quick_mood_pill
        variables:
          - name: Cyberpunk
          - icon: mdi:lightning-bolt
          - color: cyan
          - palette_id: cyberpunk
          - active_bg: "linear-gradient(135deg, rgba(6, 182, 212, 0.40), rgba(14, 116, 144, 0.22))"
          - active_border: "rgba(6, 182, 212, 0.95)"
          - glow: "rgba(6, 182, 212, 0.45)"
      - type: custom:decluttering-card
        template: quick_mood_pill
        variables:
          - name: Nordic
          - icon: mdi:snowflake
          - color: light-blue
          - palette_id: nordic
          - active_bg: "linear-gradient(135deg, rgba(56, 189, 248, 0.40), rgba(3, 105, 161, 0.22))"
          - active_border: "rgba(56, 189, 248, 0.95)"
          - glow: "rgba(56, 189, 248, 0.45)"

  # --- EFFECTS: Shifting (22s color drift toggle), Toast flash, Eagles chant.
  - type: grid
    square: false
    columns: 3
    card_mod:
      style: |
        :host {
          margin: 0 0 6px 0 !important;
          display: block !important;
        }
        #root { gap: 4px !important; }
    cards:
      - type: custom:decluttering-card
        template: effect_pill
        variables:
          - name: Shifting
          - icon: mdi:waves
          - color: cyan
          - action: pyscript.toggle_ambient_drift
          - active_expr: "is_state('sensor.basement_effect', 'drift')"
          - idle_bg: "rgba(255, 255, 255, 0.05)"
          - idle_border: "rgba(255, 255, 255, 0.12)"
          - active_bg: "linear-gradient(135deg, rgba(6, 182, 212, 0.40), rgba(14, 116, 144, 0.22))"
          - active_border: "rgba(6, 182, 212, 0.95)"
          - glow: "rgba(6, 182, 212, 0.45)"
          - text_color: "#67e8f9"
      - type: custom:decluttering-card
        template: effect_pill
        variables:
          - name: Toast
          - icon: mdi:glass-flute
          - color: amber
          - action: pyscript.effect_bar_toast
          - idle_bg: "rgba(245, 158, 11, 0.15)"
          - idle_border: "rgba(245, 158, 11, 0.5)"
          - text_color: "#fbbf24"
      - type: custom:decluttering-card
        template: effect_pill
        variables:
          - name: Eagles
          - icon: mdi:football
          - color: green
          - action: pyscript.effect_eagles_chant
          - active_expr: "is_state('sensor.philadelphia_eagles', 'IN') or (is_state('sensor.theater_mode', 'sports') and is_state('input_select.basement_lighting_mode', 'Social Mode'))"
          - idle_bg: "rgba(0, 170, 35, 0.15)"
          - idle_border: "rgba(0, 170, 35, 0.45)"
          - active_bg: "linear-gradient(135deg, rgba(0, 170, 35, 0.45), rgba(0, 95, 20, 0.25))"
          - active_border: "rgba(0, 170, 35, 0.95)"
          - glow: "rgba(0, 170, 35, 0.5)"
          - text_color: "#4ade80"

  # 1. Lounge & Bar Master (9 Bulbs ZHA Group)
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.zigbee_basement_lights
    name: Lounge & Bar (9 Bulbs)
    icon: mdi:sofa
    show_state: true
    hold_action:
      action: more-info
      haptic: medium
    sub_button:
      - entity: light.zigbee_bar_lights
        icon: mdi:glass-cocktail
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
      - entity: light.zigbee_lounge_lights
        icon: mdi:sofa
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
    # Tint follows the light: its own color when it reports one, warm amber
    # when on without color, neutral when off. config.entity is the card's entity.
    card_mod: &zone_slider_style
      style: |
        {% set on = is_state(config.entity, 'on') %}
        {% set rgb = state_attr(config.entity, 'rgb_color') %}
        {% set c = (rgb | join(', ')) if (on and rgb) else ('255, 193, 7' if on else '255, 255, 255') %}
        ha-card { border: none !important; background: none !important;}
        .bubble-container {
          border: 1px solid rgba({{ c }}, {{ 0.5 if on else 0.12 }}) !important;
          border-radius: 20px !important;
          background: linear-gradient(135deg, rgba({{ c }}, {{ 0.20 if on else 0.05 }}), rgba({{ c }}, {{ 0.07 if on else 0.03 }})) !important;
          transition: background 0.4s ease, border-color 0.4s ease !important;
        }

  # 2. Theater Zone Master
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.theater_lights
    name: Theater Lights
    icon: mdi:theater
    show_state: true
    sub_button:
      - entity: light.theater_dimmer
        icon: mdi:ceiling-light
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
      - entity: switch.bias_lights
        icon: mdi:led-strip
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
    card_mod: *zone_slider_style

  # 3. Stairlights
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.stairlights
    name: Stairlights (3 Bulbs)
    icon: mdi:stairs
    show_state: true
    hold_action:
      action: more-info
      haptic: medium
    sub_button:
      - icon: mdi:candle
        show_background: true
        tap_action:
          action: perform-action
          perform_action: light.turn_on
          target:
            entity_id: light.stairlights
          data:
            brightness_pct: 2
            color_temp_kelvin: 2000
          haptic: light
      - icon: mdi:lightbulb-on
        show_background: true
        tap_action:
          action: perform-action
          perform_action: light.turn_on
          target:
            entity_id: light.stairlights
          data:
            brightness_pct: 100
          haptic: light
    card_mod: *zone_slider_style