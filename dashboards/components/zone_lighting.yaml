type: vertical-stack
card_mod:
  style: |
    #root > * { margin-bottom: 8px !important; }
    #root {
      background: rgba(255, 193, 7, 0.08) !important;
      border: 1px solid rgba(255, 193, 7, 0.3) !important;
      border-radius: 24px !important;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      padding: 12px !important;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }
cards:
  # Header row: "Lighting" with the mode and theme on the left, and on the right
  # the Themes chip, which opens the Themes pop-up (components/theme_library_popup.yaml):
  # Toast and Eagles, then search, filter, pick, or edit and save themes.
  - type: horizontal-stack
    card_mod:
      style: |
        #root { align-items: center !important; gap: 4px !important; }
        #root > :first-child { flex: 1 1 auto !important; min-width: 0 !important; }
        #root > :last-child { flex: 0 0 auto !important; }
    cards:
      - type: custom:mushroom-template-card
        primary: Lighting
        secondary: >-
          {% if is_state('input_select.basement_lighting_mode', 'Social Mode') %}Social{% set label = state_attr('sensor.basement_palette', 'label') %}{{ ' • ' ~ label if label else '' }}{% else %}Daily Driver{% endif %} • {{ 'Lights on' if is_state('binary_sensor.basement_lights_active', 'on') else 'Lights off' }}
        icon: mdi:lightbulb-multiple
        icon_color: amber
        layout: horizontal
        card_mod:
          style: |
            ha-card {
              background: none !important;
              border: none !important;
              box-shadow: none !important;
              padding: 0 4px !important;
              margin: 0 0 2px 0 !important;
            }
            ha-card .primary {
              font-size: 0.78rem !important;
              font-weight: 700 !important;
              letter-spacing: 1.2px !important;
              text-transform: uppercase !important;
              opacity: 0.85 !important;
            }
            ha-card .secondary { font-size: 0.7rem !important; opacity: 0.6 !important; }
            ha-card mushroom-shape-icon {
              --shape-size: 24px !important;
              --icon-size: 16px !important;
              --shape-color: transparent !important;
            }
      - type: custom:mushroom-chips-card
        alignment: end
        chips:
          - type: template
            icon: mdi:palette-swatch
            icon_color: >-
              {% set sw = state_attr('sensor.basement_palette', 'swatch') or [] %}
              {{ sw[0] if sw and is_state('input_select.basement_lighting_mode', 'Social Mode') else 'amber' }}
            content: Themes
            tap_action:
              action: navigate
              navigation_path: "#themes"
              haptic: light
        card_mod:
          style: |
            ha-card { margin: 0 !important; }

  # 1. Lounge & Bar Master (9 Bulbs ZHA Group)
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.zigbee_basement_lights
    name: Lounge & Bar (9 Bulbs)
    icon: mdi:sofa
    show_state: true
    hold_action:
      action: more-info
      haptic: medium
    sub_button:
      - entity: light.zigbee_bar_lights
        icon: mdi:glass-cocktail
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
      - entity: light.zigbee_lounge_lights
        icon: mdi:sofa
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
    # Tint follows the light: its own color when it reports one, warm amber
    # when on without color, neutral when off. config.entity is the card's entity.
    card_mod: &zone_slider_style
      style: |
        {% set on = is_state(config.entity, 'on') %}
        {% set rgb = state_attr(config.entity, 'rgb_color') %}
        {% set c = (rgb | join(', ')) if (on and rgb) else ('255, 193, 7' if on else '255, 255, 255') %}
        ha-card { border: none !important; background: none !important;}
        .bubble-container {
          border: 1px solid rgba({{ c }}, {{ 0.5 if on else 0.12 }}) !important;
          border-radius: 20px !important;
          background: linear-gradient(135deg, rgba({{ c }}, {{ 0.20 if on else 0.05 }}), rgba({{ c }}, {{ 0.07 if on else 0.03 }})) !important;
          transition: background 0.4s ease, border-color 0.4s ease !important;
        }

  # 2. Theater Zone Master
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.theater_lights
    name: Theater Lights
    icon: mdi:theater
    show_state: true
    sub_button:
      - entity: light.theater_dimmer
        icon: mdi:ceiling-light
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
      - entity: switch.bias_lights
        icon: mdi:led-strip
        show_state: false
        show_background: true
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
          haptic: medium
    card_mod: *zone_slider_style

  # 3. Stairlights
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.stairlights
    name: Stairlights (3 Bulbs)
    icon: mdi:stairs
    show_state: true
    hold_action:
      action: more-info
      haptic: medium
    sub_button:
      - icon: mdi:candle
        show_background: true
        tap_action:
          action: perform-action
          perform_action: light.turn_on
          target:
            entity_id: light.stairlights
          data:
            brightness_pct: 2
            color_temp_kelvin: 2000
          haptic: light
      - icon: mdi:lightbulb-on
        show_background: true
        tap_action:
          action: perform-action
          perform_action: light.turn_on
          target:
            entity_id: light.stairlights
          data:
            brightness_pct: 100
          haptic: light
    card_mod: *zone_slider_style