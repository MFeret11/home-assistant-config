# Up Next: the next unwatched episode of each show in progress, from Trakt
# (packages/trakt.yaml). Shown only while the theater is idle, to help pick
# what to put on.
type: conditional
conditions:
  - condition: state
    entity: binary_sensor.theater_in_use
    state: "off"
  - condition: numeric_state
    entity: sensor.trakt_next_to_watch_all
    above: 0
card:
  type: markdown
  content: >-
    {% set items = (state_attr('sensor.trakt_next_to_watch_all', 'data') or [])[1:] %}
    **UP NEXT**

    {% for i in items %}
    **{{ i.title }}** · {{ i.number }} · {{ i.episode }}

    {% endfor %}
  card_mod:
    style: |
      ha-card {
        background: rgba(33, 150, 243, 0.08) !important;
        border: 1px solid rgba(33, 150, 243, 0.3) !important;
        border-radius: 24px !important;
        backdrop-filter: blur(16px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        padding: 4px 8px !important;
        font-size: 0.85rem;
      }
