# Vacuum pop-up for the Home dashboard, opened by the Vacuum tile (#vaculina).
# Top to bottom: status, Start/Pause/Dock, floor and cleaning settings, map.

type: custom:bubble-card
card_type: pop-up
hash: '#vaculina'
name: Vaculina Floorplan
icon: mdi:robot-vacuum
show_header: true
bg_color: rgba(10, 15, 26, 0.96)
bg_blur: 24
shadow_opacity: 0.8
cards:
  # Status line
  - type: custom:mushroom-template-card
    primary: >-
      Vaculina • {{ states('vacuum.vaculina') | title }}
    secondary: >-
      Battery: {{ states('sensor.vaculina_battery_level') }}% • Cleaned: {{ states('sensor.vaculina_cleaned_area') | round(0, default='—') }} ft² • Dock: {{ states('sensor.vaculina_charging_status') | title }}
    icon: mdi:robot-vacuum
    icon_color: >-
      {% set s = states('vacuum.vaculina') %}
      {{ 'red' if s == 'error' else 'blue' if s in ['cleaning', 'returning'] else 'green' }}
    card_mod:
      style: |
        ha-card {
          margin-bottom: 4px !important;
        }

  # Start / Pause / Dock
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        content: Start
        icon: mdi:play
        icon_color: green
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: vacuum.vaculina
      - type: template
        content: Pause
        icon: mdi:pause
        icon_color: amber
        tap_action:
          action: perform-action
          perform_action: vacuum.pause
          target:
            entity_id: vacuum.vaculina
      - type: template
        content: Dock
        icon: mdi:home-import-outline
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: vacuum.return_to_base
          target:
            entity_id: vacuum.vaculina

  # Floor and cleaning settings. Switching floors only changes which saved
  # map the robot uses: carry it to that floor first, as in the Dreame app.
  # Suction/mode/humidity only apply with CleanGenius off, so they hide otherwise.
  - type: entities
    entities:
      - entity: select.vaculina_selected_map
        name: Floor
        icon: mdi:layers-outline
      - entity: select.vaculina_cleangenius
        name: CleanGenius
      - type: conditional
        conditions:
          - entity: select.vaculina_cleangenius_mode
            state_not: unavailable
        row:
          entity: select.vaculina_cleangenius_mode
          name: CleanGenius Mode
      - type: conditional
        conditions:
          - entity: select.vaculina_cleaning_mode
            state_not: unavailable
        row:
          entity: select.vaculina_cleaning_mode
          name: Cleaning Mode
      - type: conditional
        conditions:
          - entity: select.vaculina_suction_level
            state_not: unavailable
        row:
          entity: select.vaculina_suction_level
          name: Suction
      - type: conditional
        conditions:
          - entity: select.vaculina_mop_pad_humidity
            state_not: unavailable
        row:
          entity: select.vaculina_mop_pad_humidity
          name: Mop Humidity
    card_mod:
      style: |
        ha-card {
          margin-bottom: 4px !important;
        }

  # Live map with room, zone and go-to cleaning. One preset per floor; the
  # card shows the preset whose condition matches the selected floor.
  # The settings every floor shares are written once under &floor and reused
  # with "<<: *floor".
  #
  # Rooms: one line each. The id is the room's number in the Dreame app, and
  # x/y place the icon and its label (the same point, label 35 below). They
  # came from the rooms attribute of camera.vaculina_map on 2026-10-26 (basement on 2026-11-19):
  # update them if rooms are renamed or re-split in the app.
  - type: custom:xiaomi-vacuum-map-card
    <<: &floor
      entity: vacuum.vaculina
      vacuum_platform: Tasshack/dreame-vacuum
      map_source:
        camera: camera.vaculina_map
      calibration_source:
        camera: true
    preset_name: First floor
    conditions:
      - entity: select.vaculina_selected_map
        value: "First floor"
    map_modes:
      - template: vacuum_clean_segment
        predefined_selections:
          - {id: "1", icon: {name: mdi:toilet,               x: -1525, y: -925},  label: {text: "Bathroom",    x: -1525, y: -925,  offset_y: 35}}
          - {id: "2", icon: {name: mdi:room-service-outline, x: 2525,  y: -725},  label: {text: "Dining Room", x: 2525,  y: -725,  offset_y: 35}}
          - {id: "3", icon: {name: mdi:sofa-outline,         x: -525,  y: 5175},  label: {text: "Living Room", x: -525,  y: 5175,  offset_y: 35}}
          - {id: "4", icon: {name: mdi:chef-hat,             x: 4375,  y: 5425},  label: {text: "Kitchen",     x: 4375,  y: 5425,  offset_y: 35}}
          - {id: "5", icon: {name: mdi:monitor-shimmer,      x: -75,   y: -3575}, label: {text: "Office",      x: -75,   y: -3575, offset_y: 35}}
      - template: vacuum_clean_zone
      - template: vacuum_goto
    additional_presets:
      - <<: *floor
        preset_name: Basement
        conditions:
          - entity: select.vaculina_selected_map
            value: "Basement"
        map_modes:
          - template: vacuum_clean_segment
            predefined_selections:
              - {id: "1", icon: {name: mdi:gamepad-variant-outline, x: -2375, y: -2125}, label: {text: "Recreation Area", x: -2375, y: -2125, offset_y: 35}}
              - {id: "2", icon: {name: mdi:home-outline,            x: 1575,  y: -4175}, label: {text: "Theater",         x: 1575,  y: -4175, offset_y: 35}}
              - {id: "3", icon: {name: mdi:home-outline,            x: -2375, y: 3675},  label: {text: "Bar",             x: -2375, y: 3675,  offset_y: 35}}
              - {id: "4", icon: {name: mdi:dumbbell,                x: 1725,  y: 3025},  label: {text: "Fitness Area",    x: 1725,  y: 3025,  offset_y: 35}}
          - template: vacuum_clean_zone
          - template: vacuum_goto
      - <<: *floor
        preset_name: 2nd floor
        conditions:
          - entity: select.vaculina_selected_map
            value: "2nd floor"
        map_modes:
          - template: vacuum_clean_segment
            predefined_selections:
              - {id: "1", icon: {name: mdi:home-outline,     x: 3025,  y: 3375},  label: {text: "Guest room",      x: 3025,  y: 3375,  offset_y: 35}}
              - {id: "2", icon: {name: mdi:home-outline,     x: -2725, y: 475},   label: {text: "Guest bathroom",  x: -2725, y: 475,   offset_y: 35}}
              - {id: "3", icon: {name: mdi:foot-print,       x: 4625,  y: 225},   label: {text: "Hallway",         x: 4625,  y: 225,   offset_y: 35}}
              - {id: "4", icon: {name: mdi:home-outline,     x: -1825, y: -2675}, label: {text: "Master closet",   x: -1825, y: -2675, offset_y: 35}}
              - {id: "5", icon: {name: mdi:home-outline,     x: -1525, y: -5025}, label: {text: "Master bathroom", x: -1525, y: -5025, offset_y: 35}}
              - {id: "6", icon: {name: mdi:bed-king-outline, x: 2075,  y: -3775}, label: {text: "Master Bedroom",  x: 2075,  y: -3775, offset_y: 35}}
              - {id: "7", icon: {name: mdi:desk,             x: -2125, y: 4425},  label: {text: "Office 2",        x: -2125, y: 4425,  offset_y: 35}}
          - template: vacuum_clean_zone
          - template: vacuum_goto
      - <<: *floor
        preset_name: 3rd floor
        conditions:
          - entity: select.vaculina_selected_map
            value: "3rd floor"
        map_modes:
          - template: vacuum_clean_segment
            predefined_selections:
              - {id: "2", icon: {name: mdi:home-outline, x: 2625, y: -1475}, label: {text: "Palace", x: 2625, y: -1475, offset_y: 35}}
              - {id: "3", icon: {name: mdi:home-outline, x: -775, y: -325},  label: {text: "Loft",   x: -775, y: -325,  offset_y: 35}}
          - template: vacuum_clean_zone
          - template: vacuum_goto
    card_mod:
      style: |
        ha-card {
          contain: content !important;
          /* Room markers: the card's defaults lean on theme variables
             this theme doesn't set, so picked and unpicked rooms looked
             alike. Unpicked = dark chip, picked = orange chip. */
          --map-card-room-icon-background-color: rgba(28, 32, 40, 0.78);
          --map-card-room-icon-color: rgba(255, 255, 255, 0.92);
          --map-card-room-label-color: rgba(255, 255, 255, 0.95);
          --map-card-room-icon-background-color-selected: #ff6d00;
          --map-card-room-icon-color-selected: #ffffff;
          --map-card-room-label-color-selected: #ffb74d;
        }
        /* Dark halo keeps room names readable on any room color. */
        .room-label {
          paint-order: stroke;
          stroke: rgba(0, 0, 0, 0.7);
          stroke-width: calc(3px / var(--map-scale, 1));
          stroke-linejoin: round;
        }
        .room-wrapper.selected > * > .room-icon-wrapper {
          box-shadow: 0 0 0 2px #ffffff;
        }
