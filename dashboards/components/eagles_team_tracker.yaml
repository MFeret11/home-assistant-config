type: conditional
conditions:
  - condition: state
    entity: binary_sensor.theater_in_use
    state: "on"
  - condition: state
    entity: sensor.theater_mode
    state: sports
  - condition: or
    conditions:
      - condition: state
        entity: sensor.philadelphia_eagles
        state: "IN"
      - condition: state
        entity: sensor.philadelphia_eagles
        state: "PRE"
      - condition: state
        entity: sensor.philadelphia_eagles
        state: "POST"
card:
  type: custom:compact-team-tracker-card
  entity: sensor.philadelphia_eagles
  show_timeouts: true
  tap_action:
    action: perform-action
    perform_action: pyscript.effect_eagles_chant
    haptic: heavy
  card_mod:
    style: |
      ha-card {
        contain: content !important;
        margin: 0 0 10px 0 !important;
        border-radius: 18px !important;
        background: linear-gradient(135deg, rgba(0, 170, 35, 0.28), rgba(0, 95, 20, 0.16)) !important;
        border: 1.5px solid rgba(0, 170, 35, 0.65) !important;
        box-shadow: 0 8px 24px rgba(0, 170, 35, 0.25) !important;
        transition: all 0.2s ease !important;
      }
      ha-card:active {
        transform: scale(0.98);
      }
