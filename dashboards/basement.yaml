title: Basement
decluttering_templates: !include components/decluttering_templates.yaml

views:
  - title: Basement
    path: basement
    icon: mdi:home-floor-b
    type: sections
    max_columns: 2
    sections:
      # HEADER: full width across the top
      - type: grid
        column_span: 2
        cards:
          - !include components/header_cockpit_chips.yaml
          - !include components/header_avr_volume.yaml
          - !include components/header_booth_announcer.yaml
          # Phones stack the columns lighting-first, so they get the now-playing
          # poster up here instead (shown only while the theater is in use).
          - type: vertical-stack
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            cards:
              - !include components/now_playing_marquee.yaml

      # LEFT (first on a phone): lighting, the most-used controls
      - type: grid
        cards:
          - !include components/zone_lighting.yaml

      # RIGHT: theater. Modes usually start from the Onn remote, so this
      # column is now-playing plus a compact mode strip and session controls.
      - type: grid
        cards:
          # Wider screens: poster at the top of the theater column (phones: see header).
          - type: vertical-stack
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            cards:
              - !include components/now_playing_marquee.yaml
          - !include components/theater_stage.yaml
          - !include components/new_seasons_trakt.yaml
          - !include components/theater_remote_popup.yaml
          - !include components/theme_library_popup.yaml
