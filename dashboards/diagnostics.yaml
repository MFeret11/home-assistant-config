title: Diagnostics
views:
  - title: Diagnostics
    path: diagnostics
    icon: mdi:wrench-cog
    type: sections
    max_columns: 4
    sections:
      # Top Navigation Header Row
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            card_mod:
              style: |
                ha-card {
                  --chip-height: 42px;
                  --chip-icon-size: 20px;
                  margin-bottom: 4px !important;
                }
            chips:
              - type: template
                icon: mdi:arrow-left
                content: Home
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-home/home
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(33, 150, 243, 0.12) !important;
                      border: 1px solid rgba(33, 150, 243, 0.35) !important;
                      border-radius: 20px !important;
                    }
                    ha-card:active { transform: scale(0.95); }
              - type: template
                icon: mdi:home-floor-b
                content: Basement
                icon_color: amber
                tap_action:
                  action: navigate
                  navigation_path: /basement-yaml/basement
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 179, 0, 0.12) !important;
                      border: 1px solid rgba(255, 179, 0, 0.35) !important;
                      border-radius: 20px !important;
                    }
                    ha-card:active { transform: scale(0.95); }
              - type: template
                icon: mdi:history
                content: Activity Log
                icon_color: purple
                tap_action:
                  action: navigate
                  navigation_path: /activity-log/activity-log
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(156, 39, 176, 0.12) !important;
                      border: 1px solid rgba(156, 39, 176, 0.35) !important;
                      border-radius: 20px !important;
                    }
                    ha-card:active { transform: scale(0.95); }
              - type: template
                icon: mdi:tools
                content: Maintenance
                icon_color: orange
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics/maintenance
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 152, 0, 0.12) !important;
                      border: 1px solid rgba(255, 152, 0, 0.35) !important;
                      border-radius: 20px !important;
                    }
                    ha-card:active { transform: scale(0.95); }
          # Executive Infrastructure KPI Bar
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: CPU
                secondary: >-
                  {{ states('sensor.system_monitor_processor_use') | round(0, default='—') }}% ·
                  {{ states('sensor.system_monitor_processor_temperature') | round(0, default='—') }}°F
                icon: mdi:cpu-64-bit
                # Red above 75% load or 80°C (176°F), where the Pi 4 starts to throttle.
                icon_color: >-
                  {{ 'red' if states('sensor.system_monitor_processor_use') | float(0) > 75
                     or states('sensor.system_monitor_processor_temperature') | float(0) > 176 else 'green' }}
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 10px !important;
                    }
              - type: custom:mushroom-template-card
                primary: RAM
                secondary: "{{ states('sensor.system_monitor_memory_usage') | round(0, default='—') }}%"
                icon: mdi:memory
                icon_color: blue
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 10px !important;
                    }
              - type: custom:mushroom-template-card
                primary: SSD Storage
                secondary: "{{ states('sensor.system_monitor_disk_usage') | round(0, default='—') }}%"
                icon: mdi:harddisk
                icon_color: teal
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 10px !important;
                    }
              - type: custom:mushroom-template-card
                primary: Tuners
                secondary: "{{ states('sensor.hdhomerun_tuner_allocation') }}"
                icon: mdi:antenna
                icon_color: >-
                  {{ 'amber' if is_state('binary_sensor.hdhomerun_contention_risk', 'on') else 'green' }}
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 10px !important;
                    }

      - type: grid
        cards:
          - type: heading
            heading: System Health
            icon: mdi:heart-pulse
          # Lists only what needs a look; one green line when everything passes.
          - type: markdown
            content: >-
              {%- set ns = namespace(l=[]) -%}
              {%- if is_state('binary_sensor.ssd_health_problem', 'on') -%}
                {%- set ns.l = ns.l + ['🔴 SSD reports a SMART problem'] -%}
              {%- endif -%}
              {%- if is_state('binary_sensor.ssd_health_report_stale', 'on') -%}
                {%- set ns.l = ns.l + ['🟡 SSD health report is stale'] -%}
              {%- endif -%}
              {%- if states('sensor.ssd_temperature') | float(0) > 131 -%}
                {%- set ns.l = ns.l + ['🟡 SSD running warm: ' ~ states('sensor.ssd_temperature') | round(0) ~ '°F'] -%}
              {%- endif -%}
              {%- if states('sensor.system_monitor_processor_temperature') | float(0) > 176 -%}
                {%- set ns.l = ns.l + ['🔴 CPU running hot: ' ~ states('sensor.system_monitor_processor_temperature') | round(0) ~ '°F'] -%}
              {%- endif -%}
              {%- if states('sensor.system_monitor_disk_usage') | float(0) > 85 -%}
                {%- set ns.l = ns.l + ['🟡 SSD ' ~ states('sensor.system_monitor_disk_usage') | round(0) ~ '% full'] -%}
              {%- endif -%}
              {%- set last = as_timestamp(states('sensor.backup_last_successful_automatic_backup'), 0) -%}
              {%- if as_timestamp(now()) - last > 36 * 3600 -%}
                {%- set ns.l = ns.l + ['🟡 No successful backup in the last 36 hours'] -%}
              {%- endif -%}
              {%- if is_state('binary_sensor.verizon_router_wan_status', 'off') -%}
                {%- set ns.l = ns.l + ['🔴 Internet (WAN) is down'] -%}
              {%- endif -%}
              {%- if is_state('binary_sensor.transit_microservice', 'off') -%}
                {%- set ns.l = ns.l + ['🟡 Transit service (:8000) is not responding'] -%}
              {%- endif -%}
              {%- if states('sensor.watchman_missing_actions') | int(0) > 0 -%}
                {%- set ns.l = ns.l + ['🟡 Watchman: ' ~ states('sensor.watchman_missing_actions') ~ ' action(s) called but not defined'] -%}
              {%- endif -%}
              {%- if ns.l -%}
                {{ ns.l | join('\n\n') }}
              {%- else -%}
                ✅ All health checks passing
              {%- endif -%}
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  font-size: 1.05rem;
                }
          - type: entities
            entities:
              - type: section
                label: SSD
              - entity: sensor.ssd_life_remaining
                name: Life Remaining
              - entity: sensor.ssd_temperature
                name: Temperature
              - entity: binary_sensor.ssd_health_problem
                name: SMART Problem
              - entity: sensor.ssd_last_health_report
                name: Last Health Report
                format: relative
              - entity: sensor.system_monitor_processor_temperature
                name: CPU Temperature
              - type: section
                label: Backups
              - entity: sensor.backup_last_successful_automatic_backup
                name: Last Successful
                format: relative
              - entity: sensor.backup_next_scheduled_automatic_backup
                name: Next Scheduled
                format: relative
              - entity: sensor.whole_house_google_drive_backup_used_storage
                name: Google Drive Used
              - type: section
                label: Network
              - entity: binary_sensor.verizon_router_wan_status
                name: Internet (WAN)
              - entity: sensor.verizon_router_download_speed
                name: WAN Download (live)
              - entity: sensor.verizon_router_upload_speed
                name: WAN Upload (live)
              - type: section
                label: Config (Watchman)
              - entity: sensor.watchman_missing_entities
                name: Missing Entities
              - entity: sensor.watchman_missing_actions
                name: Missing Actions
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Host & Infrastructure (RPi 4)
            icon: mdi:raspberry-pi
          - type: entities
            entities:
              - entity: sensor.system_monitor_processor_use
                name: CPU Utilization
                icon: mdi:cpu-64-bit
              - entity: sensor.system_monitor_memory_usage
                name: RAM Utilization
                icon: mdi:memory
              - entity: sensor.system_monitor_swap_usage
                name: Swap Utilization
                icon: mdi:server
              - entity: sensor.system_monitor_disk_usage
                name: SSD Storage Used (/)
                icon: mdi:harddisk
              - entity: binary_sensor.transit_microservice
                name: FastAPI Transit Service (:8000)
                icon: mdi:server-network
              - entity: sensor.watchdog_system_health
                name: Watchdog Infrastructure Health
                icon: mdi:shield-check
              - entity: sensor.basement_automation_health
                name: Preflight Automation Health
                icon: mdi:check-decagram
              - entity: sensor.system_monitor_uptime
                name: System Uptime
                icon: mdi:clock-outline
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }
          - type: heading
            heading: Theater & AV Hardware
            icon: mdi:theater
          - type: entities
            entities:
              - entity: sensor.theater_mode
                name: Resolved Theater Mode
              - entity: binary_sensor.theater_in_use
                name: Theater In-Use Flag
              - entity: media_player.theater_receiver
                name: Yamaha AVR (IP .250)
              - entity: media_player.onn_pro
                name: Onn 4K Pro (Android TV)
              - entity: media_player.onn_pro_2
                name: Onn 4K Pro (Cast Feed)
              - entity: remote.onn_pro
                name: Onn Remote Bridge
              # Relays are read-only here: a toggle would cut power and skip
              # the safety interlocks (the row confirmation never applied to it).
              - type: simple-entity
                entity: switch.batocera
                name: Batocera PC Relay
              - entity: sensor.batocera_current
                name: Batocera Current Draw
              - entity: sensor.projector_power_state
                name: Projector State Machine
              - entity: sensor.projector_current_rounded
                name: Projector Filtered Current (A)
              - entity: sensor.batocera_current_rounded
                name: Batocera Filtered Current (A)
              - entity: sensor.theater_total_power
                name: Theater Total Power (W)
              - type: simple-entity
                entity: switch.projector
                name: Optoma Projector Relay
              - entity: sensor.projector_current
                name: Projector Current Draw (Raw)
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }
          - type: custom:mini-graph-card
            # Only recorded sensors can be graphed; theater_total_power is excluded.
            name: Projector Cooldown (24h)
            icon: mdi:lightning-bolt
            entities:
              - entity: sensor.projector_current_rounded
                name: Projector (A)
                color: "#ff9800"
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            animate: true
            show:
              graph: line
              fill: fade
              legend: true
              average: true
              extrema: true
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Modes & Lighting Engine
            icon: mdi:tune
          - type: entities
            entities:
              - entity: sensor.basement_palette
                name: Active Spatial Palette
              - entity: sensor.basement_effect
                name: Active Lighting Modifier
              - entity: binary_sensor.basement_lights_active
                name: Any Lights Active Resolver
              - entity: input_select.basement_theater_mode
                name: Theater Activity Select
              - entity: binary_sensor.basement_automation_allowed
                name: Automation Allowed Flag
              - entity: >-
                  switch.basement_adaptive_lighting_adaptive_lighting_basement_adaptive_lighting
                name: Master Adaptive Lighting Engine
              - entity: >-
                  switch.adaptive_lighting_basement_adaptive_lighting_adaptive_lighting_sleep_mode_basement_adaptive_lighting
                name: Adaptive Sleep Mode
              - entity: >-
                  switch.adaptive_lighting_basement_adaptive_lighting_adaptive_lighting_adapt_brightness_basement_adaptive_lighting
                name: Adapt Brightness
              - entity: >-
                  switch.adaptive_lighting_basement_adaptive_lighting_adaptive_lighting_adapt_color_basement_adaptive_lighting
                name: Adapt Color
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Sensors & Zone Bulbs
            icon: mdi:door
          - type: entities
            entities:
              - entity: binary_sensor.basement_stairs_door_sensor
                name: Top Stair Door Sensor
              - entity: binary_sensor.bottom_stairs
                name: Foot of Stairs Motion
              - entity: light.stairlights
                name: Stairlights (3 Bulbs)
              - entity: light.theater_dimmer
                name: Matter Theater Dimmer
              - entity: switch.bias_lights
                name: Screen Bias Lights
              - entity: light.zigbee_bar_lights
                name: "Bar Zone (North: 2 Bulbs)"
              - entity: light.zigbee_lounge_lights_1
                name: "Lounge Front (Center: 3 Bulbs)"
              - entity: light.zigbee_lounge_lights_2
                name: "Lounge Mid (South: 2 Bulbs)"
              - entity: light.zigbee_lounge_lights_3
                name: "Lounge Rear (Screen: 2 Bulbs)"
              - entity: light.zigbee_lounge_lights
                name: Master Lounge Zigbee Group
              - entity: light.zigbee_basement_lights
                name: Master Basement Zigbee Group
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Antenna Tuners
            icon: mdi:antenna
          - type: entities
            entities:
              - entity: sensor.hdhomerun_tuner_allocation
                name: Tuner Allocation
              - entity: binary_sensor.hdhomerun_contention_risk
                name: Contention Risk
              - entity: input_boolean.xteve_tuner_reservation
                name: xTeVe Tuner Reservation
              - type: section
                label: Tuner 0
              - entity: sensor.tuner0
                name: Channel
              - type: conditional
                conditions:
                  - entity: sensor.tuner0_target_ip
                    state_not: unknown
                  - entity: sensor.tuner0_target_ip
                    state_not: unavailable
                row:
                  entity: sensor.tuner0_target_ip
                  name: Client
              - type: conditional
                conditions:
                  - entity: sensor.tuner0_signal_quality
                    state_not: unknown
                  - entity: sensor.tuner0_signal_quality
                    state_not: unavailable
                row:
                  entity: sensor.tuner0_signal_quality
                  name: Signal Quality
              - type: conditional
                conditions:
                  - entity: sensor.tuner0_network_rate
                    state_not: unknown
                  - entity: sensor.tuner0_network_rate
                    state_not: unavailable
                row:
                  entity: sensor.tuner0_network_rate
                  name: Stream Rate
              - type: section
                label: Tuner 1
              - entity: sensor.tuner1
                name: Channel
              - type: conditional
                conditions:
                  - entity: sensor.tuner1_target_ip
                    state_not: unknown
                  - entity: sensor.tuner1_target_ip
                    state_not: unavailable
                row:
                  entity: sensor.tuner1_target_ip
                  name: Client
              - type: conditional
                conditions:
                  - entity: sensor.tuner1_signal_quality
                    state_not: unknown
                  - entity: sensor.tuner1_signal_quality
                    state_not: unavailable
                row:
                  entity: sensor.tuner1_signal_quality
                  name: Signal Quality
              - type: conditional
                conditions:
                  - entity: sensor.tuner1_network_rate
                    state_not: unknown
                  - entity: sensor.tuner1_network_rate
                    state_not: unavailable
                row:
                  entity: sensor.tuner1_network_rate
                  name: Stream Rate
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }

  # Consumables, batteries and updates: everything that wears out or needs a hand.
  - title: Maintenance
    path: maintenance
    icon: mdi:tools
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            card_mod:
              style: |
                ha-card {
                  --chip-height: 42px;
                  --chip-icon-size: 20px;
                  margin-bottom: 4px !important;
                }
            chips:
              - type: template
                icon: mdi:arrow-left
                content: Home
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-home/home
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(33, 150, 243, 0.12) !important;
                      border: 1px solid rgba(33, 150, 243, 0.35) !important;
                      border-radius: 20px !important;
                    }
                    ha-card:active { transform: scale(0.95); }
              - type: template
                icon: mdi:wrench-cog
                content: Diagnostics
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics/diagnostics
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0, 150, 136, 0.12) !important;
                      border: 1px solid rgba(0, 150, 136, 0.35) !important;
                      border-radius: 20px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

      - type: grid
        cards:
          - type: heading
            heading: Chores
            icon: mdi:clipboard-text-clock
          # Home Keeper (HACS): recurring house chores with completion history.
          - type: custom:home-keeper-card
            filter: all
            sort: due
            group_by: none
          - type: heading
            heading: Needs Attention
            icon: mdi:alert-circle-outline
          # Lines come from sensor.maintenance_attention (packages/house_status.yaml),
          # which also feeds the Maintenance tile on home.yaml.
          - type: markdown
            content: >-
              {%- set items = state_attr('sensor.maintenance_attention', 'items') or [] -%}
              {{ items | join('\n\n') if items else '✅ Nothing needs attention' }}
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  font-size: 1.05rem;
                }
          - type: heading
            heading: Updates
            icon: mdi:package-up
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - domain: update
                  state: "on"
            sort:
              method: friendly_name
            else:
              type: markdown
              content: ✅ Everything is up to date
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                }

      - type: grid
        cards:
          - type: heading
            heading: Vaculina
            icon: mdi:robot-vacuum
          - type: entities
            entities:
              - type: section
                label: Parts (life left)
              - type: custom:template-entity-row
                entity: sensor.vaculina_main_brush_left
                name: Main Brush
                state: "{{ states('sensor.vaculina_main_brush_left') }}% · {{ states('sensor.vaculina_main_brush_time_left') }}h"
              - type: custom:template-entity-row
                entity: sensor.vaculina_side_brush_left
                name: Side Brush
                state: "{{ states('sensor.vaculina_side_brush_left') }}% · {{ states('sensor.vaculina_side_brush_time_left') }}h"
              - type: custom:template-entity-row
                entity: sensor.vaculina_filter_left
                name: Filter
                state: "{{ states('sensor.vaculina_filter_left') }}% · {{ states('sensor.vaculina_filter_time_left') }}h"
              - type: custom:template-entity-row
                entity: sensor.vaculina_sensor_dirty_left
                name: Sensor Cleaning
                state: "{{ states('sensor.vaculina_sensor_dirty_left') }}% · {{ states('sensor.vaculina_sensor_dirty_time_left') }}h"
              - type: custom:template-entity-row
                entity: sensor.vaculina_wheel_dirty_left
                name: Wheel Cleaning
                state: "{{ states('sensor.vaculina_wheel_dirty_left') }}% · {{ states('sensor.vaculina_wheel_dirty_time_left') }}h"
              - type: custom:template-entity-row
                entity: sensor.vaculina_scale_inhibitor_left
                name: Scale Inhibitor
                state: "{{ states('sensor.vaculina_scale_inhibitor_left') }}% · {{ states('sensor.vaculina_scale_inhibitor_time_left') }}h"
              # Tap after replacing or cleaning a part; the confirmation prevents stray resets.
              - type: section
                label: Reset After Replacing
              - type: button
                entity: button.vaculina_reset_main_brush
                name: Main Brush
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.vaculina_reset_main_brush
                  confirmation:
                    text: Reset the main brush counter? Only do this after replacing or cleaning it.
              - type: button
                entity: button.vaculina_reset_side_brush
                name: Side Brush
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.vaculina_reset_side_brush
                  confirmation:
                    text: Reset the side brush counter? Only do this after replacing or cleaning it.
              - type: button
                entity: button.vaculina_reset_filter
                name: Filter
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.vaculina_reset_filter
                  confirmation:
                    text: Reset the filter counter? Only do this after replacing or cleaning it.
              - type: button
                entity: button.vaculina_reset_sensor
                name: Sensors
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.vaculina_reset_sensor
                  confirmation:
                    text: Reset the sensors counter? Only do this after replacing or cleaning it.
              - type: button
                entity: button.vaculina_reset_wheel
                name: Wheel
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.vaculina_reset_wheel
                  confirmation:
                    text: Reset the wheel counter? Only do this after replacing or cleaning it.
              - type: button
                entity: button.vaculina_reset_scale_inhibitor
                name: Scale Inhibitor
                icon: mdi:restore
