title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:clock-outline
          - type: custom:mushroom-title-card
            title: "{{ now().strftime('%-I:%M %p') }}"
            subtitle: "{{ now().strftime('%A, %B %-d') }}"
            alignment: center
            card_mod:
              style: |
                ha-card {
                  padding-bottom: 2px !important;
                }
                .title {
                  font-size: 2.4rem !important;
                  font-weight: 700 !important;
                  letter-spacing: -0.03em;
                }
                .subtitle {
                  font-size: 0.95rem !important;
                  opacity: 0.75;
                }
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  --chip-height: 44px;
                  --chip-icon-size: 22px;
                  --chip-spacing: 8px;
                  margin-bottom: 6px !important;
                }
            chips:
              # Theater Active Indicator
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.theater_in_use
                    state: "on"
                chip:
                  type: template
                  icon: mdi:filmstrip
                  icon_color: blue
                  tap_action:
                    action: navigate
                    navigation_path: /basement-yaml/basement
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(33, 150, 243, 0.15) !important;
                        border: 1px solid rgba(33, 150, 243, 0.4) !important;
                      }

              # Commute Window
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.septa_am_window
                    state: "on"
                chip:
                  type: template
                  icon: mdi:train
                  icon_color: >-
                    {{ 'red' if state_attr('sensor.septa_commute', 'leave_now')
                    or state_attr('sensor.septa_commute', 'missed_connection')
                    else 'blue' }}
                  tap_action:
                    action: navigate
                    navigation_path: /kitchen-kiosk
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(33, 150, 243, 0.15) !important;
                        border: 1px solid rgba(33, 150, 243, 0.4) !important;
                      }

              # 3D Printer
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.office_creality_printer_print_status
                    state_not:
                      - unavailable
                      - unknown
                      - "off"
                      - standby
                chip:
                  type: template
                  icon: mdi:printer-3d
                  icon_color: amber
                  tap_action:
                    action: navigate
                    navigation_path: '#printer-3d'
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(255, 179, 0, 0.15) !important;
                        border: 1px solid rgba(255, 179, 0, 0.4) !important;
                      }

              # High Host CPU Alert
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.system_monitor_processor_use
                    above: 75
                chip:
                  type: template
                  icon: mdi:cpu-64-bit
                  icon_color: red
                  tap_action:
                    action: navigate
                    navigation_path: /dashboard-diagnostics
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(244, 67, 54, 0.2) !important;
                        border: 1px solid rgba(244, 67, 54, 0.5) !important;
                      }

          # --- QUICK ACTION COMMAND BAR ---
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Vacuum
                secondary: "{{ states('vacuum.vaculina') | title }}"
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set s = states('vacuum.vaculina') %}
                  {{ 'red' if s == 'error' else 'blue' if s in ['cleaning', 'returning'] else 'grey' }}
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#vaculina'
                  haptic: medium
                card_mod:
                  style: |
                    ha-card {
                      {% set s = states('vacuum.vaculina') %}
                      background: {{ 'linear-gradient(135deg, rgba(33, 150, 243, 0.3), rgba(13, 71, 161, 0.15))' if s in ['cleaning', 'returning'] else 'rgba(255, 255, 255, 0.04)' }} !important;
                      border: 1px solid {{ 'rgba(33, 150, 243, 0.6)' if s in ['cleaning', 'returning'] else 'rgba(255, 255, 255, 0.08)' }} !important;
                      border-radius: 20px !important;
                      padding: 10px 4px !important;
                      box-shadow: {{ '0 4px 18px rgba(33, 150, 243, 0.3)' if s in ['cleaning', 'returning'] else 'none' }};
                      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
                    }
                    ha-card:active { transform: scale(0.92); }

              - type: custom:mushroom-template-card
                primary: Social
                secondary: >-
                  {{ 'Active' if is_state('input_select.basement_lighting_mode', 'Social Mode') else 'Off' }}
                icon: mdi:party-popper
                icon_color: >-
                  {{ 'purple' if is_state('input_select.basement_lighting_mode', 'Social Mode') else 'grey' }}
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: pyscript.toggle_lighting_mode
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      {% set on = is_state('input_select.basement_lighting_mode', 'Social Mode') %}
                      background: {{ 'linear-gradient(135deg, rgba(156, 39, 176, 0.3), rgba(74, 20, 140, 0.15))' if on else 'rgba(255, 255, 255, 0.04)' }} !important;
                      border: 1px solid {{ 'rgba(156, 39, 176, 0.65)' if on else 'rgba(255, 255, 255, 0.08)' }} !important;
                      border-radius: 20px !important;
                      padding: 10px 4px !important;
                      box-shadow: {{ '0 4px 18px rgba(156, 39, 176, 0.3)' if on else 'none' }};
                      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
                    }
                    ha-card:active { transform: scale(0.92); }

              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.basement_lights_active
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: Kill
                  icon: mdi:lightbulb-multiple-off
                  icon_color: red
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: pyscript.basement_all_off
                    haptic: medium
                  card_mod:
                    style: |
                      ha-card {
                        background: linear-gradient(135deg, rgba(244, 67, 54, 0.35), rgba(183, 28, 28, 0.18)) !important;
                        border: 1px solid rgba(244, 67, 54, 0.7) !important;
                        border-radius: 20px !important;
                        padding: 10px 4px !important;
                        box-shadow: 0 4px 18px rgba(244, 67, 54, 0.35);
                        transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
                      }
                      ha-card:active { transform: scale(0.92); }

          # --- VACULINA LIVE FLOORPLAN & CONTROLS POP-UP ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#vaculina'
            name: Vaculina Floorplan
            icon: mdi:robot-vacuum
            show_header: true
            bg_color: rgba(10, 15, 26, 0.96)
            bg_blur: 24
            shadow_opacity: 0.8
            cards:
              # Live Telemetry Strip
              - type: custom:mushroom-template-card
                primary: >-
                  Vaculina • {{ states('vacuum.vaculina') | title }}
                secondary: >-
                  Battery: {{ states('sensor.vaculina_battery_level') }}% • Cleaned: {{ states('sensor.vaculina_cleaned_area') | round(0, default='—') }} ft² • Dock: {{ states('sensor.vaculina_charging_status') | title }}
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set s = states('vacuum.vaculina') %}
                  {{ 'red' if s == 'error' else 'blue' if s in ['cleaning', 'returning'] else 'green' }}
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 18px !important;
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      margin-bottom: 4px !important;
                    }

              # Floor and cleaning settings. Switching floors only changes which saved
              # map the robot uses: carry it to that floor first, as in the Dreame app.
              # Suction/mode/humidity only apply with CleanGenius off, so they hide otherwise.
              - type: entities
                entities:
                  - entity: select.vaculina_selected_map
                    name: Floor
                    icon: mdi:layers-outline
                  - entity: select.vaculina_cleangenius
                    name: CleanGenius
                  - entity: select.vaculina_cleangenius_mode
                    name: CleanGenius Mode
                  - type: conditional
                    conditions:
                      - entity: select.vaculina_cleaning_mode
                        state_not: unavailable
                    row:
                      entity: select.vaculina_cleaning_mode
                      name: Cleaning Mode
                  - type: conditional
                    conditions:
                      - entity: select.vaculina_suction_level
                        state_not: unavailable
                    row:
                      entity: select.vaculina_suction_level
                      name: Suction
                  - type: conditional
                    conditions:
                      - entity: select.vaculina_mop_pad_humidity
                        state_not: unavailable
                    row:
                      entity: select.vaculina_mop_pad_humidity
                      name: Mop Humidity
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 18px !important;
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      margin-bottom: 4px !important;
                    }

              # Live map with room, zone and go-to cleaning. One preset per floor; the
              # card shows the preset whose condition matches the selected floor.
              # Room ids/positions were generated from camera.vaculina_map_1..4 on
              # 2026-10-26: regenerate if rooms are renamed or re-split in the app.
              - type: custom:xiaomi-vacuum-map-card
                entity: vacuum.vaculina
                vacuum_platform: Tasshack/dreame-vacuum
                preset_name: First floor
                conditions:
                  - entity: select.vaculina_selected_map
                    value: "First floor"
                map_source:
                  camera: camera.vaculina_map
                calibration_source:
                  camera: true
                map_modes:
                  - template: vacuum_clean_segment
                    predefined_selections:
                      - id: "1"
                        icon:
                          name: mdi:toilet
                          x: -1525
                          y: -925
                        label:
                          text: "Bathroom"
                          x: -1525
                          y: -925
                          offset_y: 35
                      - id: "2"
                        icon:
                          name: mdi:room-service-outline
                          x: 2525
                          y: -725
                        label:
                          text: "Dining Room"
                          x: 2525
                          y: -725
                          offset_y: 35
                      - id: "3"
                        icon:
                          name: mdi:sofa-outline
                          x: -525
                          y: 5175
                        label:
                          text: "Living Room"
                          x: -525
                          y: 5175
                          offset_y: 35
                      - id: "4"
                        icon:
                          name: mdi:chef-hat
                          x: 4375
                          y: 5425
                        label:
                          text: "Kitchen"
                          x: 4375
                          y: 5425
                          offset_y: 35
                      - id: "5"
                        icon:
                          name: mdi:monitor-shimmer
                          x: -75
                          y: -3575
                        label:
                          text: "Office"
                          x: -75
                          y: -3575
                          offset_y: 35
                  - template: vacuum_clean_zone
                  - template: vacuum_goto
                additional_presets:
                  - preset_name: Basement
                    entity: vacuum.vaculina
                    vacuum_platform: Tasshack/dreame-vacuum
                    conditions:
                      - entity: select.vaculina_selected_map
                        value: "Basement"
                    map_source:
                      camera: camera.vaculina_map
                    calibration_source:
                      camera: true
                    map_modes:
                      - template: vacuum_clean_segment
                        predefined_selections:
                          - id: "1"
                            icon:
                              name: mdi:gamepad-variant-outline
                              x: -2375
                              y: -2125
                            label:
                              text: "Recreation Area"
                              x: -2375
                              y: -2125
                              offset_y: 35
                          - id: "2"
                            icon:
                              name: mdi:home-outline
                              x: 2275
                              y: -4175
                            label:
                              text: "Theater"
                              x: 2275
                              y: -4175
                              offset_y: 35
                          - id: "3"
                            icon:
                              name: mdi:home-outline
                              x: -2375
                              y: 3825
                            label:
                              text: "Bar"
                              x: -2375
                              y: 3825
                              offset_y: 35
                      - template: vacuum_clean_zone
                      - template: vacuum_goto
                  - preset_name: 2nd floor
                    entity: vacuum.vaculina
                    vacuum_platform: Tasshack/dreame-vacuum
                    conditions:
                      - entity: select.vaculina_selected_map
                        value: "2nd floor"
                    map_source:
                      camera: camera.vaculina_map
                    calibration_source:
                      camera: true
                    map_modes:
                      - template: vacuum_clean_segment
                        predefined_selections:
                          - id: "1"
                            icon:
                              name: mdi:home-outline
                              x: 3025
                              y: 3375
                            label:
                              text: "Guest room"
                              x: 3025
                              y: 3375
                              offset_y: 35
                          - id: "2"
                            icon:
                              name: mdi:home-outline
                              x: -2725
                              y: 475
                            label:
                              text: "Guest bathroom"
                              x: -2725
                              y: 475
                              offset_y: 35
                          - id: "3"
                            icon:
                              name: mdi:foot-print
                              x: 4625
                              y: 225
                            label:
                              text: "Hallway"
                              x: 4625
                              y: 225
                              offset_y: 35
                          - id: "4"
                            icon:
                              name: mdi:home-outline
                              x: -1825
                              y: -2675
                            label:
                              text: "Master closet"
                              x: -1825
                              y: -2675
                              offset_y: 35
                          - id: "5"
                            icon:
                              name: mdi:home-outline
                              x: -1525
                              y: -5025
                            label:
                              text: "Master bathroom"
                              x: -1525
                              y: -5025
                              offset_y: 35
                          - id: "6"
                            icon:
                              name: mdi:bed-king-outline
                              x: 2075
                              y: -3775
                            label:
                              text: "Master Bedroom"
                              x: 2075
                              y: -3775
                              offset_y: 35
                          - id: "7"
                            icon:
                              name: mdi:home-outline
                              x: -2125
                              y: 4425
                            label:
                              text: "Room 7"
                              x: -2125
                              y: 4425
                              offset_y: 35
                      - template: vacuum_clean_zone
                      - template: vacuum_goto
                  - preset_name: 3rd floor
                    entity: vacuum.vaculina
                    vacuum_platform: Tasshack/dreame-vacuum
                    conditions:
                      - entity: select.vaculina_selected_map
                        value: "3rd floor"
                    map_source:
                      camera: camera.vaculina_map
                    calibration_source:
                      camera: true
                    map_modes:
                      - template: vacuum_clean_segment
                        predefined_selections:
                          - id: "2"
                            icon:
                              name: mdi:home-outline
                              x: 2625
                              y: -1475
                            label:
                              text: "Palace"
                              x: 2625
                              y: -1475
                              offset_y: 35
                          - id: "3"
                            icon:
                              name: mdi:home-outline
                              x: -775
                              y: -325
                            label:
                              text: "Loft"
                              x: -775
                              y: -325
                              offset_y: 35
                      - template: vacuum_clean_zone
                      - template: vacuum_goto
                card_mod:
                  style: |
                    ha-card {
                      contain: content !important;
                      border-radius: 20px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }

              # Quick Controls
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: template
                    content: Start
                    icon: mdi:play
                    icon_color: green
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.start
                      target:
                        entity_id: vacuum.vaculina
                  - type: template
                    content: Pause
                    icon: mdi:pause
                    icon_color: amber
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.pause
                      target:
                        entity_id: vacuum.vaculina
                  - type: template
                    content: Dock
                    icon: mdi:home-import-outline
                    icon_color: blue
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.return_to_base
                      target:
                        entity_id: vacuum.vaculina

      # =========================================================
      # SECTION 2: LIVE ACTIVITY
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Live Activity
            icon: mdi:radar

          # 1. Philly games: each team shows only while its game is live, starts
          # within 24 hours, or ended in the last 12 (binary_sensor.*_game_soon
          # in packages/sports.yaml).
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.eagles_game_soon
                state: "on"
            card:
              type: custom:compact-team-tracker
              entities:
                - sensor.philadelphia_eagles
              layout: standard
              show_day_of_week: true
              show_tv_network: true
              show_league: false
              show_event_name: false
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.sixers_game_soon
                state: "on"
            card:
              type: custom:compact-team-tracker
              entities:
                - sensor.nba_philadelphia_76ers
              layout: standard
              show_day_of_week: true
              show_tv_network: true
              show_league: false
              show_event_name: false
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.phillies_game_soon
                state: "on"
            card:
              type: custom:compact-team-tracker
              entities:
                - sensor.mlb_philadelphia_phillies
              layout: standard
              show_day_of_week: true
              show_tv_network: true
              show_league: false
              show_event_name: false
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.flyers_game_soon
                state: "on"
            card:
              type: custom:compact-team-tracker
              entities:
                - sensor.nhl_philadelphia_flyers
              layout: standard
              show_day_of_week: true
              show_tv_network: true
              show_league: false
              show_event_name: false
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }

          # 2. SEPTA Commute Window
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.septa_am_window
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: >-
                {{ '🚨 LEAVE NOW' if state_attr('sensor.septa_commute', 'leave_now') else 'Leave by ' ~ (state_attr('sensor.septa_commute', 'leave_by_time') | default('—', true)) }}
              secondary: >-
                {{ states('sensor.commute_weather') | default('Check transit schedule', true) }}
              icon: mdi:train-car
              icon_color: >-
                {{ 'red' if state_attr('sensor.septa_commute', 'leave_now') else 'blue' }}
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /kitchen-kiosk
              card_mod:
                style: |
                  ha-card {
                    background: rgba(33, 150, 243, 0.1) !important;
                    border: 1px solid rgba(33, 150, 243, 0.3) !important;
                    border-radius: 20px;
                    margin-bottom: 6px;
                  }

          # 3. Cinema / Theater In Use
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.theater_in_use
                state: "on"
            card:
              type: custom:mushroom-media-player-card
              entity: media_player.onn_pro
              name: Cinema Playing
              use_media_info: true
              show_volume_level: false
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /basement-yaml/basement
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }

          # 4. Vaculina Active
          - type: conditional
            conditions:
              - condition: state
                entity: vacuum.vaculina
                state:
                  - cleaning
                  - returning
                  - paused
                  - error
            card:
              type: custom:vacuum-card
              entity: vacuum.vaculina
              name: Vaculina
              stats:
                default:
                  - entity_id: sensor.vaculina_battery_level
                    subtitle: Battery
                    unit: "%"
                  - entity_id: sensor.vaculina_cleaned_area
                    subtitle: Cleaned Area
                    unit: "ft²"
                  - entity_id: sensor.vaculina_charging_status
                    subtitle: Status
              actions:
                start:
                  service: vacuum.start
                pause:
                  service: vacuum.pause
                stop:
                  service: vacuum.stop
                return_to_base:
                  service: vacuum.return_to_base
              shortcuts:
                - name: Pause
                  service: vacuum.pause
                  icon: mdi:pause
                - name: Dock
                  service: vacuum.return_to_base
                  icon: mdi:home-import-outline
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    background: rgba(255, 255, 255, 0.04) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    margin-bottom: 6px !important;
                  }

          # 5. 3D Print Progress
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.office_creality_printer_print_status
                state_not:
                  - unavailable
                  - unknown
                  - "off"
                  - standby
            card:
              type: custom:mushroom-template-card
              primary: >-
                3D Print: {{ states('sensor.office_creality_printer_print_status') | title }}
              secondary: >-
                {% set left = states('sensor.office_creality_printer_print_time_left') %}
                Progress: {{ states('sensor.office_creality_printer_print_progress') }}%{% if left | is_number and left | int > 0 %} · {{ (left | int // 3600) }}h {{ ((left | int % 3600) // 60) }}m left{% endif %}
              icon: mdi:printer-3d
              icon_color: amber
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: '#printer-3d'
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }

          # 6. Nominal Resting State
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.philadelphia_eagles
                state_not: IN
              - condition: state
                entity: binary_sensor.septa_am_window
                state: "off"
              - condition: state
                entity: binary_sensor.theater_in_use
                state: "off"
              # Mirror of the vacuum card's states, so one of the two always shows
              # (including when the vacuum is unavailable).
              - condition: state
                entity: vacuum.vaculina
                state_not:
                  - cleaning
                  - returning
                  - paused
                  - error
              - condition: state
                entity: sensor.office_creality_printer_print_status
                state:
                  - unavailable
                  - unknown
                  - "off"
                  - standby
            card:
              type: custom:mushroom-template-card
              primary: All Systems Quiet
              secondary: House running nominal in resting state
              icon: mdi:shield-check
              icon_color: green
              layout: horizontal
              card_mod:
                style: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.02) !important;
                    border: 1px solid rgba(255, 255, 255, 0.05) !important;
                    border-radius: 20px;
                    opacity: 0.85;
                  }

          # 7. Next Calendar Event
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.next_calendar_event') }}"
            secondary: "{{ state_attr('sensor.next_calendar_event', 'when') or '' }}"
            icon: mdi:calendar-clock
            icon_color: orange
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: /calendar
            card_mod:
              style: |
                ha-card {
                  background: rgba(255, 255, 255, 0.04) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  border-radius: 20px;
                  margin-bottom: 6px;
                }

      # =========================================================
      # SECTION 3: AREAS & SYSTEMS
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Areas & Systems
            icon: mdi:compass-outline
          - type: horizontal-stack
            cards:
              # BASEMENT AREA CARD (THEATER-AWARE)
              - type: custom:mushroom-template-card
                primary: Basement
                secondary: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    Cinema • {{ states('sensor.theater_mode') | title }}
                  {% elif is_state('binary_sensor.basement_lights_active', 'on') %}
                    Lights On • Active
                  {% else %}
                    Dormant
                  {% endif %}
                icon: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    mdi:theater
                  {% else %}
                    mdi:home-floor-b
                  {% endif %}
                icon_color: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    blue
                  {% elif is_state('binary_sensor.basement_lights_active', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /basement-yaml/basement
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'linear-gradient(135deg, rgba(33, 150, 243, 0.2), rgba(13, 71, 161, 0.1))' if is_state('binary_sensor.theater_in_use', 'on') else ('rgba(255, 193, 7, 0.1)' if is_state('binary_sensor.basement_lights_active', 'on') else 'rgba(255, 255, 255, 0.04)') }} !important;
                      border: 1px solid {{ 'rgba(33, 150, 243, 0.45)' if is_state('binary_sensor.theater_in_use', 'on') else ('rgba(255, 193, 7, 0.3)' if is_state('binary_sensor.basement_lights_active', 'on') else 'rgba(255, 255, 255, 0.08)') }} !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                      transition: all 0.25s ease !important;
                    }
                    ha-card:active { transform: scale(0.95); }

              - type: custom:mushroom-template-card
                primary: Bedroom
                secondary: >-
                  {{ states('light.zigbee_bedroom_lights') | default('Off', true) | title }}
                icon: mdi:bed
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-home2/bedroom
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: History
                secondary: 24h Activity
                icon: mdi:chart-timeline-variant-shimmer
                icon_color: purple
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /activity-log/activity-log
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

              - type: custom:mushroom-template-card
                primary: Telemetry
                secondary: >-
                  {{ states('sensor.system_monitor_processor_use') | round(0, default='—') }}% CPU
                icon: mdi:server-network
                icon_color: teal
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Security
                secondary: >-
                  {{ states('sensor.cameras_online') }}/{{ state_attr('sensor.cameras_online', 'total') }} cameras online
                icon: mdi:cctv
                icon_color: >-
                  {{ 'red' if state_attr('sensor.cameras_online', 'offline') else 'cyan' }}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: '#security-cams'
                  haptic: light
                card_mod:
                  style: |
                    {% set down = state_attr('sensor.cameras_online', 'offline') %}
                    ha-card {
                      background: {{ 'rgba(244, 67, 54, 0.12)' if down else 'rgba(0, 188, 212, 0.06)' }} !important;
                      border: 1px solid {{ 'rgba(244, 67, 54, 0.5)' if down else 'rgba(0, 188, 212, 0.2)' }} !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

              - type: custom:mushroom-template-card
                primary: Maintenance
                secondary: >-
                  {%- set n = states('sensor.maintenance_attention') | int(0) -%}
                  {{ 'All good' if n == 0 else n ~ ' need' ~ ('s' if n == 1 else '') ~ ' attention' }}
                icon: mdi:tools
                icon_color: orange
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics/maintenance
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

          # --- SECURITY CAMERAS LIVE FEED POP-UP MODAL (ON-DEMAND) ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#security-cams'
            name: Perimeter Security
            icon: mdi:cctv
            show_header: true
            bg_color: rgba(10, 15, 26, 0.96)
            bg_blur: 24
            shadow_opacity: 0.8
            cards:
              # Sirens are left off on purpose so a stray tap can't set one off.
              - type: entities
                title: Camera Controls
                show_header_toggle: false
                entities:
                  - entity: switch.wyze_notifications
                    name: All Wyze Notifications
                  - type: section
                    label: Motion Detection
                  - entity: switch.front_porch_cam_motion_detection
                    name: Front Porch
                  - entity: switch.back_deck_cam_motion_detection
                    name: Back Deck
                  - entity: switch.back_yard_cam_motion_detection
                    name: Back Yard
                  - type: section
                    label: Notifications
                  - entity: switch.front_porch_cam_notifications
                    name: Front Porch
                  - entity: switch.back_deck_cam_notifications
                    name: Back Deck
                  - entity: switch.back_yard_cam_notifications
                    name: Back Yard
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }
              - type: picture-entity
                entity: camera.front_porch_cam
                name: Front Porch
                camera_view: live
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }
              - type: picture-entity
                entity: camera.back_deck_cam
                name: Back Deck
                camera_view: live
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }
              - type: picture-entity
                entity: camera.back_yard_cam
                name: Back Yard
                camera_view: live
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }

          # --- 3D PRINTER POP-UP (opened from the print chip and progress card) ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#printer-3d'
            name: 3D Printer
            icon: mdi:printer-3d
            show_header: true
            bg_color: rgba(10, 15, 26, 0.96)
            bg_blur: 24
            shadow_opacity: 0.8
            cards:
              - type: picture-entity
                entity: image.office_creality_printer_current_print_preview
                show_name: false
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                    }
              - type: custom:mushroom-template-card
                primary: >-
                  {{ states('sensor.office_creality_printer_current_object') | default('Print', true) }}
                secondary: >-
                  {% set left = states('sensor.office_creality_printer_print_time_left') %}
                  {{ states('sensor.office_creality_printer_print_status') | title }} ·
                  {{ states('sensor.office_creality_printer_print_progress') }}% ·
                  layer {{ states('sensor.office_creality_printer_working_layer') }}/{{ states('sensor.office_creality_printer_total_layers') }}{% if left | is_number and left | int > 0 %} · {{ (left | int // 3600) }}h {{ ((left | int % 3600) // 60) }}m left{% endif %}
                icon: mdi:printer-3d-nozzle
                icon_color: amber
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                    }
              - type: entities
                entities:
                  - entity: sensor.office_creality_printer_nozzle_temperature
                    name: Nozzle
                  - entity: sensor.office_creality_printer_bed_temperature
                    name: Bed
                  - entity: sensor.office_creality_printer_chamber_temperature
                    name: Chamber
                  - entity: sensor.office_creality_printer_print_speed
                    name: Print Speed
                  - entity: sensor.office_creality_printer_filament_status
                    name: Filament
                  - entity: light.office_creality_printer_light
                    name: Printer Light
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }

      # =========================================================
      # SECTION 4: FORECAST
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Forecast
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            # Same NWS source as the kitchen kiosk. NWS has no "daily" forecast, only day/night pairs.
            entity: weather.whole_house_national_weather_service_kphl
            forecast_type: twice_daily
            forecast_slots: 6
            show_current: true
            show_forecast: true
            card_mod:
              style: |
                ha-card {
                  border-radius: 24px !important;
                  background: rgba(255, 255, 255, 0.03) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
                }