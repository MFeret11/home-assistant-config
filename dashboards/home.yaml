title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    # Built by scripts/build_house_theme.py (Frosted Glass Dark Lite + the
    # glass-tile styles these cards use).
    theme: House Glass
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: "{{ now().strftime('%-I:%M %p') }}"
            # Date, then the outdoor temp and what to wear (sensor.commute_weather).
            subtitle: >-
              {%- set t = state_attr('sensor.commute_weather', 'current_temp_f') -%}
              {%- set w = states('sensor.commute_weather') -%}
              {{ now().strftime('%A, %B %-d') }}
              {%- if t is number %} · {{ t }}°{% endif %}
              {%- if w not in ['unknown', 'unavailable', ''] %} · {{ w }}{% endif %}
            alignment: center
            card_mod:
              style: |
                ha-card {
                  padding-bottom: 2px !important;
                }
                .title {
                  font-size: 2.4rem !important;
                  font-weight: 700 !important;
                  letter-spacing: -0.03em;
                }
                .subtitle {
                  font-size: 0.95rem !important;
                  opacity: 0.75;
                }
          # High CPU alert. The whole row is conditional, so it leaves no gap
          # when the Pi is fine.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.system_monitor_processor_use
                above: 75
            card:
              type: custom:mushroom-chips-card
              alignment: center
              card_mod:
                style: |
                  ha-card {
                    --chip-height: 44px;
                    --chip-icon-size: 22px;
                    --chip-spacing: 8px;
                    margin-bottom: 6px !important;
                  }
              chips:
                - type: template
                  icon: mdi:cpu-64-bit
                  icon_color: red
                  content: "{{ states('sensor.system_monitor_processor_use') | round(0) }}% CPU"
                  tap_action:
                    action: navigate
                    navigation_path: /dashboard-diagnostics
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(244, 67, 54, 0.2) !important;
                        border: 1px solid rgba(244, 67, 54, 0.5) !important;
                      }

          # Weather Service watch/warning banner, shared with the kitchen tablet;
          # hidden when there's none.
          - !include components/shared/weather_alert.yaml
          # Things that need doing (maintenance, offline cameras, stair door left
          # open): the kitchen tablet's attention row. Hidden when there's none.
          - !include components/shared/attention.yaml

          # --- QUICK ACTION COMMAND BAR ---
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Vacuum
                secondary: "{{ states('vacuum.vaculina') | title }}"
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set s = states('vacuum.vaculina') %}
                  {{ 'red' if s == 'error' else 'blue' if s in ['cleaning', 'returning'] else 'grey' }}
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#vaculina'
                  haptic: medium
                card_mod:
                  class: glass-tile tall
                  style: |
                    ha-card {
                      --tile-rgb: 33, 150, 243;
                      --tile-on: {{ 1 if states('vacuum.vaculina') in ['cleaning', 'returning'] else 0 }};
                    }

              - type: custom:mushroom-template-card
                primary: Social
                secondary: >-
                  {{ 'On' if is_state('input_select.basement_lighting_mode', 'Social Mode') else 'Off' }}
                icon: mdi:party-popper
                icon_color: >-
                  {{ 'purple' if is_state('input_select.basement_lighting_mode', 'Social Mode') else 'grey' }}
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: pyscript.toggle_lighting_mode
                  haptic: light
                card_mod:
                  class: glass-tile tall
                  style: |
                    ha-card {
                      --tile-rgb: 156, 39, 176;
                      --tile-on: {{ 1 if is_state('input_select.basement_lighting_mode', 'Social Mode') else 0 }};
                    }

              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.basement_lights_active
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  primary: Lights off
                  secondary: Basement
                  icon: mdi:lightbulb-multiple-off
                  icon_color: red
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: pyscript.basement_all_off
                    haptic: medium
                  card_mod:
                    class: glass-tile tall
                    style: |
                      ha-card {
                        --tile-rgb: 244, 67, 54;
                        --tile-on: 1;
                      }

          # --- VACULINA LIVE FLOORPLAN & CONTROLS POP-UP ---
          - !include components/home/vacuum_popup.yaml

      # =========================================================
      # SECTION 2: LIVE ACTIVITY
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Live Activity
            icon: mdi:radar

          # Trains home, only while one of us is in Center City.
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.in_center_city
                state: "on"
            card:
              type: vertical-stack
              cards: !include components/home/trains_home.yaml

          # 1. Train cards, the same ones as the kitchen tablet: the morning train
          # (weekday commute window), then the train home once the commuter
          # leaves work, until they're home.
          - !include components/shared/commute_am.yaml
          - !include components/shared/commute_pm.yaml

          # 2. Theater in use
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.theater_in_use
                state: "on"
            card:
              # Title from the poster sensor (theater.py), so it is right in every
              # mode; the Onn's own media info is empty for music and games.
              type: custom:mushroom-template-card
              primary: >-
                {{ state_attr('sensor.theater_current_poster', 'title') or 'Theater in use' }}
              secondary: >-
                {%- set sub = state_attr('sensor.theater_current_poster', 'subtitle') -%}
                {%- from 'house_status.jinja' import theater_mode_name -%}
                {{ theater_mode_name() }}{{ ' · ' ~ sub if sub else '' }}
              icon: >-
                {{ {'movie': 'mdi:movie-open', 'sports': 'mdi:football', 'game': 'mdi:gamepad-variant',
                    'music': 'mdi:music'}.get(states('sensor.theater_mode'), 'mdi:theater') }}
              icon_color: blue
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /basement-yaml/basement
              card_mod:
                style: |
                  ha-card {
                    margin-bottom: 6px !important;
                  }

          # 3. 3D Print Progress
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.office_creality_printer_print_status
                state_not:
                  - unavailable
                  - unknown
                  - "off"
                  - standby
            card:
              type: custom:mushroom-template-card
              primary: >-
                3D Print: {{ states('sensor.office_creality_printer_print_status') | title }}
              secondary: >-
                {% set left = states('sensor.office_creality_printer_print_time_left') %}
                Progress: {{ states('sensor.office_creality_printer_print_progress') }}%{% if left | is_number and left | int > 0 %} · {{ (left | int // 3600) }}h {{ ((left | int % 3600) // 60) }}m left{% endif %}
              icon: mdi:printer-3d
              icon_color: amber
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: '#printer-3d'
              card_mod:
                style: |
                  ha-card {
                    margin-bottom: 6px !important;
                  }

          # 4. All quiet: nothing running and nothing needs doing
          # (binary_sensor.house_quiet, packages/house_status.yaml).
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.house_quiet
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: All quiet
              secondary: Nothing running right now
              icon: mdi:shield-check
              icon_color: green
              layout: horizontal
              card_mod:
                style: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.02) !important;
                    border: 1px solid rgba(255, 255, 255, 0.05) !important;
                    opacity: 0.85;
                  }

          # 5. Next Calendar Event
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.next_calendar_event') }}"
            secondary: "{{ state_attr('sensor.next_calendar_event', 'when') or '' }}"
            icon: mdi:calendar-clock
            icon_color: orange
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: /calendar
            card_mod:
              style: |
                ha-card {
                  margin-bottom: 6px;
                }

      # =========================================================
      # SECTION 3: AREAS & SYSTEMS
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Around the house
            icon: mdi:compass-outline
          - type: horizontal-stack
            cards:
              # BASEMENT AREA CARD (THEATER-AWARE)
              - type: custom:mushroom-template-card
                primary: Basement
                secondary: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    {%- from 'house_status.jinja' import theater_mode_name %}
                    Theater · {{ theater_mode_name() }}
                  {% elif is_state('binary_sensor.basement_lights_active', 'on') %}
                    Lights on
                  {% else %}
                    Lights off
                  {% endif %}
                icon: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    mdi:theater
                  {% else %}
                    mdi:home-floor-b
                  {% endif %}
                icon_color: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    blue
                  {% elif is_state('binary_sensor.basement_lights_active', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /basement-yaml/basement
                  haptic: light
                card_mod:
                  class: glass-tile row
                  style: |
                    {% set theater = is_state('binary_sensor.theater_in_use', 'on') %}
                    {% set lights = is_state('binary_sensor.basement_lights_active', 'on') %}
                    ha-card {
                      --tile-rgb: {{ '33, 150, 243' if theater else '255, 193, 7' }};
                      --tile-on: {{ 0.7 if theater else (0.4 if lights else 0) }};
                    }

              - type: custom:mushroom-template-card
                primary: Bedroom
                secondary: >-
                  {{ states('light.zigbee_bedroom_lights') | default('Off', true) | title }}
                icon: mdi:bed
                icon_color: >-
                  {{ 'amber' if is_state('light.zigbee_bedroom_lights', 'on') else 'grey' }}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-bedroom/bedroom
                  haptic: light
                card_mod:
                  class: glass-tile row
                  style: |
                    ha-card {
                      --tile-rgb: 255, 193, 7;
                      --tile-on: {{ 0.4 if is_state('light.zigbee_bedroom_lights', 'on') else 0 }};
                    }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Cameras
                secondary: >-
                  {{ states('sensor.cameras_online') }}/{{ state_attr('sensor.cameras_online', 'total') }} online
                icon: mdi:cctv
                icon_color: >-
                  {{ 'red' if state_attr('sensor.cameras_online', 'offline') else 'cyan' }}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: '#security-cams'
                  haptic: light
                card_mod:
                  class: glass-tile row
                  style: |
                    {% set down = state_attr('sensor.cameras_online', 'offline') %}
                    ha-card {
                      --tile-rgb: {{ '244, 67, 54' if down else '0, 188, 212' }};
                      --tile-on: {{ 0.5 if down else 0.25 }};
                    }

              - type: custom:mushroom-template-card
                primary: Maintenance
                secondary: >-
                  {%- set n = states('sensor.maintenance_attention') | int(0) -%}
                  {%- set items = state_attr('sensor.maintenance_attention', 'items') or [] -%}
                  {{ 'All good' if n == 0 else (items[0] if n == 1 and items else n ~ ' need attention') }}
                icon: mdi:tools
                icon_color: >-
                  {{ 'green' if states('sensor.maintenance_attention') | int(0) == 0 else 'orange' }}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics/maintenance
                  haptic: light
                card_mod:
                  class: glass-tile row
                  style: |
                    ha-card {
                      --tile-rgb: 255, 152, 0;
                      --tile-on: {{ 0.4 if states('sensor.maintenance_attention') | int(0) > 0 else 0 }};
                    }

          # Where the commuter is (sensor.partner_location is a neutral copy of the
          # location tracker; the train comes from the transit service).
          - type: custom:mushroom-template-card
            primary: !include private/partner_name.yaml
            secondary: >-
              {%- set s = states('sensor.partner_location') -%}
              {%- set train = state_attr('sensor.septa_commute', 'rider_on_train') -%}
              {%- if train -%}
                On train {{ train }} · home by {{ state_attr('sensor.septa_commute', 'actual_arrival_time') or '—' }}
              {%- elif s == 'home' -%}Home
              {%- elif s in ['unknown', 'unavailable'] -%}Location unavailable
              {%- else -%}{{ 'Away' if s == 'not_home' else s }}
              {%- endif -%}
            icon: >-
              {{ 'mdi:train' if state_attr('sensor.septa_commute', 'rider_on_train')
                 else ('mdi:home-account' if is_state('sensor.partner_location', 'home') else 'mdi:map-marker-account') }}
            icon_color: >-
              {{ 'blue' if state_attr('sensor.septa_commute', 'rider_on_train')
                 else ('green' if is_state('sensor.partner_location', 'home') else 'amber') }}
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: '#where'
            card_mod:
              class: glass-tile row

          # Behind-the-scenes pages (activity log, Pi health), so they sit last.
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: History
                secondary: Last 48 hours
                icon: mdi:chart-timeline-variant-shimmer
                icon_color: purple
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics/activity-log
                  haptic: light
                card_mod:
                  class: glass-tile row

              - type: custom:mushroom-template-card
                primary: Pi status
                secondary: >-
                  {{ states('sensor.system_monitor_processor_use') | round(0, default='—') }}% CPU
                icon: mdi:server-network
                icon_color: teal
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics
                  haptic: light
                card_mod:
                  class: glass-tile row

          # --- WHERE IS EVERYONE POP-UP (opened from the Partner tile) ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#where'
            name: Where
            icon: mdi:map-marker-account
            # Pop-up look, shared by every pop-up below (and matching the
            # vacuum pop-up and the basement's).
            <<: &popup_look
              show_header: true
              bg_color: rgba(10, 15, 26, 0.96)
              bg_blur: 24
              shadow_opacity: 0.8
            cards:
              - type: map
                entities:
                  - entity: sensor.partner_location
                    name: !include private/partner_name.yaml
                  - entity: sensor.me_location
                    name: !include private/me_name.yaml
                auto_fit: true
                aspect_ratio: "1"

          # --- SECURITY CAMERAS LIVE FEED POP-UP MODAL (ON-DEMAND) ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#security-cams'
            name: Cameras
            icon: mdi:cctv
            <<: *popup_look
            cards:
              # All three cams in a grid by default; tap one to enlarge it, or use
              # the menu for fullscreen or single-camera view.
              - type: custom:advanced-camera-card
                cameras:
                  - camera_entity: camera.front_porch_cam
                    title: Front Porch
                  - camera_entity: camera.back_deck_cam
                    title: Back Deck
                  - camera_entity: camera.back_yard_cam
                    title: Back Yard
                view:
                  default: live
                live:
                  display:
                    mode: grid
                menu:
                  style: hover
                card_mod:
                  style: |
                    ha-card {
                      overflow: hidden;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }

          # --- 3D PRINTER POP-UP (opened from the progress card) ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#printer-3d'
            name: 3D Printer
            icon: mdi:printer-3d
            <<: *popup_look
            cards:
              - type: picture-entity
                entity: image.office_creality_printer_current_print_preview
                show_name: false
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                    }
              - type: custom:mushroom-template-card
                primary: >-
                  {{ states('sensor.office_creality_printer_current_object') | default('Print', true) }}
                secondary: >-
                  {% set left = states('sensor.office_creality_printer_print_time_left') %}
                  {{ states('sensor.office_creality_printer_print_status') | title }} ·
                  {{ states('sensor.office_creality_printer_print_progress') }}% ·
                  layer {{ states('sensor.office_creality_printer_working_layer') }}/{{ states('sensor.office_creality_printer_total_layers') }}{% if left | is_number and left | int > 0 %} · {{ (left | int // 3600) }}h {{ ((left | int % 3600) // 60) }}m left{% endif %}
                icon: mdi:printer-3d-nozzle
                icon_color: amber
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      margin-bottom: 8px !important;
                    }
              - type: entities
                entities:
                  - entity: sensor.office_creality_printer_nozzle_temperature
                    name: Nozzle
                  - entity: sensor.office_creality_printer_bed_temperature
                    name: Bed
                  - entity: sensor.office_creality_printer_chamber_temperature
                    name: Chamber
                  - entity: sensor.office_creality_printer_print_speed
                    name: Print Speed
                  - entity: sensor.office_creality_printer_filament_status
                    name: Filament
                  - entity: light.office_creality_printer_light
                    name: Printer Light

      # =========================================================
      # SECTION 4: FORECAST
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Forecast
            icon: mdi:weather-partly-cloudy
          # WeatherTunes: today's forecast as a song, the same widget page as the
          # kitchen tablet (see dashboards/components/shared/weathertunes.yaml for
          # how the page is rendered and versioned). Tap it to play.
          - type: iframe
            url: /local/weathertunes/kitchen.html?kitchen&widget&v=4
            allow: autoplay
            # Two rows: at phone width the cover then fills the card's height.
            grid_options:
              columns: full
              rows: 2
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                }
          # Same NWS card as the kitchen tablet (custom_templates/kitchen.jinja).
          - !include components/shared/weather_full.yaml
