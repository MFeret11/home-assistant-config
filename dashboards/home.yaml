title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:clock-outline
          - type: custom:mushroom-title-card
            title: "{{ now().strftime('%-I:%M %p') }}"
            subtitle: "{{ now().strftime('%A, %B %-d') }}"
            alignment: center
            card_mod:
              style: |
                ha-card {
                  padding-bottom: 2px !important;
                }
                .title {
                  font-size: 2.4rem !important;
                  font-weight: 700 !important;
                  letter-spacing: -0.03em;
                }
                .subtitle {
                  font-size: 0.95rem !important;
                  opacity: 0.75;
                }
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  --chip-height: 44px;
                  --chip-icon-size: 22px;
                  --chip-spacing: 8px;
                  margin-bottom: 6px !important;
                }
            chips:
              # Theater Active Indicator
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.theater_in_use
                    state: "on"
                chip:
                  type: template
                  icon: mdi:filmstrip
                  icon_color: blue
                  tap_action:
                    action: navigate
                    navigation_path: /basement-yaml/basement
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(33, 150, 243, 0.15) !important;
                        border: 1px solid rgba(33, 150, 243, 0.4) !important;
                      }

              # Commute Window
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.septa_am_window
                    state: "on"
                chip:
                  type: template
                  icon: mdi:train
                  icon_color: >-
                    {{ 'red' if state_attr('sensor.septa_commute', 'leave_now')
                    or state_attr('sensor.septa_commute', 'missed_connection')
                    else 'blue' }}
                  tap_action:
                    action: navigate
                    navigation_path: /kitchen-kiosk
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(33, 150, 243, 0.15) !important;
                        border: 1px solid rgba(33, 150, 243, 0.4) !important;
                      }

              # 3D Printer
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.office_creality_printer_print_status
                    state_not:
                      - unavailable
                      - unknown
                      - "off"
                      - standby
                chip:
                  type: template
                  icon: mdi:printer-3d
                  icon_color: amber
                  tap_action:
                    action: more-info
                    target:
                      entity_id: sensor.office_creality_printer_print_status
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(255, 179, 0, 0.15) !important;
                        border: 1px solid rgba(255, 179, 0, 0.4) !important;
                      }

              # High Host CPU Alert
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.system_monitor_processor_use
                    above: 75
                chip:
                  type: template
                  icon: mdi:cpu-64-bit
                  icon_color: red
                  tap_action:
                    action: navigate
                    navigation_path: /dashboard-diagnostics
                    haptic: light
                  card_mod:
                    style: |
                      ha-card {
                        width: 44px !important;
                        height: 44px !important;
                        padding: 0 !important;
                        border-radius: 50% !important;
                        background: rgba(244, 67, 54, 0.2) !important;
                        border: 1px solid rgba(244, 67, 54, 0.5) !important;
                      }

          # --- QUICK ACTION COMMAND BAR ---
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Vacuum
                secondary: "{{ states('vacuum.vaculina') | title }}"
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set s = states('vacuum.vaculina') %}
                  {{ 'red' if s == 'error' else 'blue' if s in ['cleaning', 'returning'] else 'grey' }}
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#vaculina'
                  haptic: medium
                hold_action:
                  action: perform-action
                  perform_action: >-
                    {% if states('vacuum.vaculina') in ['cleaning', 'paused'] %}
                      vacuum.return_to_base
                    {% else %}
                      vacuum.start
                    {% endif %}
                  target:
                    entity_id: vacuum.vaculina
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      {% set s = states('vacuum.vaculina') %}
                      background: {{ 'linear-gradient(135deg, rgba(33, 150, 243, 0.3), rgba(13, 71, 161, 0.15))' if s in ['cleaning', 'returning'] else 'rgba(255, 255, 255, 0.04)' }} !important;
                      border: 1px solid {{ 'rgba(33, 150, 243, 0.6)' if s in ['cleaning', 'returning'] else 'rgba(255, 255, 255, 0.08)' }} !important;
                      border-radius: 20px !important;
                      padding: 10px 4px !important;
                      box-shadow: {{ '0 4px 18px rgba(33, 150, 243, 0.3)' if s in ['cleaning', 'returning'] else 'none' }};
                      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
                    }
                    ha-card:active { transform: scale(0.92); }

              - type: custom:mushroom-template-card
                primary: Social
                secondary: >-
                  {{ 'Active' if is_state('input_select.basement_lighting_mode', 'Social Mode') else 'Off' }}
                icon: mdi:party-popper
                icon_color: >-
                  {{ 'purple' if is_state('input_select.basement_lighting_mode', 'Social Mode') else 'grey' }}
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: pyscript.toggle_lighting_mode
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      {% set on = is_state('input_select.basement_lighting_mode', 'Social Mode') %}
                      background: {{ 'linear-gradient(135deg, rgba(156, 39, 176, 0.3), rgba(74, 20, 140, 0.15))' if on else 'rgba(255, 255, 255, 0.04)' }} !important;
                      border: 1px solid {{ 'rgba(156, 39, 176, 0.65)' if on else 'rgba(255, 255, 255, 0.08)' }} !important;
                      border-radius: 20px !important;
                      padding: 10px 4px !important;
                      box-shadow: {{ '0 4px 18px rgba(156, 39, 176, 0.3)' if on else 'none' }};
                      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
                    }
                    ha-card:active { transform: scale(0.92); }

              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.basement_lights_active
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  primary: Lights
                  secondary: Kill
                  icon: mdi:lightbulb-multiple-off
                  icon_color: red
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: pyscript.basement_all_off
                    haptic: medium
                  card_mod:
                    style: |
                      ha-card {
                        background: linear-gradient(135deg, rgba(244, 67, 54, 0.35), rgba(183, 28, 28, 0.18)) !important;
                        border: 1px solid rgba(244, 67, 54, 0.7) !important;
                        border-radius: 20px !important;
                        padding: 10px 4px !important;
                        box-shadow: 0 4px 18px rgba(244, 67, 54, 0.35);
                        transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
                      }
                      ha-card:active { transform: scale(0.92); }

          # --- VACULINA LIVE FLOORPLAN & CONTROLS POP-UP ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#vaculina'
            name: Vaculina Floorplan
            icon: mdi:robot-vacuum
            show_header: true
            bg_color: rgba(10, 15, 26, 0.96)
            bg_blur: 24
            shadow_opacity: 0.8
            cards:
              # Live Telemetry Strip
              - type: custom:mushroom-template-card
                primary: >-
                  Vaculina • {{ states('vacuum.vaculina') | title }}
                secondary: >-
                  Battery: {{ states('sensor.vaculina_battery_level') }}% • Cleaned: {{ states('sensor.vaculina_cleaned_area') | round(0, default='—') }} ft² • Dock: {{ states('sensor.vaculina_charging_status') | title }}
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set s = states('vacuum.vaculina') %}
                  {{ 'red' if s == 'error' else 'blue' if s in ['cleaning', 'returning'] else 'green' }}
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 18px !important;
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      margin-bottom: 4px !important;
                    }

              # Interactive Floorplan Map Card
              - type: custom:xiaomi-vacuum-map-card
                entity: vacuum.vaculina
                map_source:
                  camera: camera.vaculina_map
                calibration_source:
                  camera: true
                card_mod:
                  style: |
                    ha-card {
                      contain: content !important;
                      border-radius: 20px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }

              # Quick Controls
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: template
                    content: Start
                    icon: mdi:play
                    icon_color: green
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.start
                      target:
                        entity_id: vacuum.vaculina
                  - type: template
                    content: Pause
                    icon: mdi:pause
                    icon_color: amber
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.pause
                      target:
                        entity_id: vacuum.vaculina
                  - type: template
                    content: Dock
                    icon: mdi:home-import-outline
                    icon_color: blue
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.return_to_base
                      target:
                        entity_id: vacuum.vaculina

      # =========================================================
      # SECTION 2: LIVE ACTIVITY
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Live Activity
            icon: mdi:radar

          # 1. Eagles Game Day
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.philadelphia_eagles
                state: IN
            card:
              type: custom:mushroom-template-card
              primary: Eagles Live Game
              secondary: >-
                Score: {{ state_attr('sensor.philadelphia_eagles', 'team_score') }} - {{ state_attr('sensor.philadelphia_eagles', 'opponent_score') }}
              icon: mdi:football
              icon_color: green
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /basement-yaml/basement
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(0, 200, 75, 0.25), rgba(0, 110, 30, 0.15)) !important;
                    border: 1px solid rgba(0, 200, 75, 0.5) !important;
                    border-radius: 20px;
                    margin-bottom: 6px;
                  }

          # 2. SEPTA Commute Window
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.septa_am_window
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: >-
                {{ '🚨 LEAVE NOW' if state_attr('sensor.septa_commute', 'leave_now') else 'Leave by ' ~ (state_attr('sensor.septa_commute', 'leave_by_time') | default('—', true)) }}
              secondary: >-
                {{ states('sensor.commute_weather') | default('Check transit schedule', true) }}
              icon: mdi:train-car
              icon_color: >-
                {{ 'red' if state_attr('sensor.septa_commute', 'leave_now') else 'blue' }}
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /kitchen-kiosk
              card_mod:
                style: |
                  ha-card {
                    background: rgba(33, 150, 243, 0.1) !important;
                    border: 1px solid rgba(33, 150, 243, 0.3) !important;
                    border-radius: 20px;
                    margin-bottom: 6px;
                  }

          # 3. Cinema / Theater In Use
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.theater_in_use
                state: "on"
            card:
              type: custom:mushroom-media-player-card
              entity: media_player.onn_pro
              name: Cinema Playing
              use_media_info: true
              show_volume_level: false
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /basement-yaml/basement
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }

          # 4. Vaculina Active
          - type: conditional
            conditions:
              - condition: state
                entity: vacuum.vaculina
                state:
                  - cleaning
                  - returning
                  - paused
                  - error
            card:
              type: custom:vacuum-card
              entity: vacuum.vaculina
              name: Vaculina
              stats:
                default:
                  - entity_id: sensor.vaculina_battery_level
                    subtitle: Battery
                    unit: "%"
                  - entity_id: sensor.vaculina_cleaned_area
                    subtitle: Cleaned Area
                    unit: "ft²"
                  - entity_id: sensor.vaculina_charging_status
                    subtitle: Status
              actions:
                start:
                  service: vacuum.start
                pause:
                  service: vacuum.pause
                stop:
                  service: vacuum.stop
                return_to_base:
                  service: vacuum.return_to_base
              shortcuts:
                - name: Pause
                  service: vacuum.pause
                  icon: mdi:pause
                - name: Dock
                  service: vacuum.return_to_base
                  icon: mdi:home-import-outline
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    background: rgba(255, 255, 255, 0.04) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    margin-bottom: 6px !important;
                  }

          # 5. 3D Print Progress
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.office_creality_printer_print_status
                state_not:
                  - unavailable
                  - unknown
                  - "off"
                  - standby
            card:
              type: custom:mushroom-template-card
              primary: >-
                3D Print: {{ states('sensor.office_creality_printer_print_status') | title }}
              secondary: >-
                Progress: {{ states('sensor.office_creality_printer_print_progress') }}%
              icon: mdi:printer-3d
              icon_color: amber
              layout: horizontal
              tap_action:
                action: more-info
                target:
                  entity_id: sensor.office_creality_printer_print_status
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px !important;
                    margin-bottom: 6px !important;
                  }

          # 6. Nominal Resting State
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.philadelphia_eagles
                state_not: IN
              - condition: state
                entity: binary_sensor.septa_am_window
                state: "off"
              - condition: state
                entity: binary_sensor.theater_in_use
                state: "off"
              - condition: state
                entity: vacuum.vaculina
                state:
                  - docked
                  - idle
                  - "off"
              - condition: state
                entity: sensor.office_creality_printer_print_status
                state:
                  - unavailable
                  - unknown
                  - "off"
                  - standby
            card:
              type: custom:mushroom-template-card
              primary: All Systems Quiet
              secondary: House running nominal in resting state
              icon: mdi:shield-check
              icon_color: green
              layout: horizontal
              card_mod:
                style: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.02) !important;
                    border: 1px solid rgba(255, 255, 255, 0.05) !important;
                    border-radius: 20px;
                    opacity: 0.85;
                  }

          # 7. Next Calendar Event
          - type: custom:mushroom-template-card
            primary: >-
              {%- set cals = ['calendar.matt', 'calendar.partner', 'calendar.family', 'calendar.birthdays'] -%}
              {%- set ns = namespace(ts=none, msg='No upcoming events') -%}
              {%- for c in cals -%}
                {%- set st = state_attr(c, 'start_time') -%}
                {%- if st -%}
                  {%- set ts = as_timestamp(st) -%}
                  {%- if ns.ts is none or ts < ns.ts -%}
                    {%- set ns.ts = ts -%}
                    {%- set ns.msg = state_attr(c, 'message') -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.msg }}
            secondary: >-
              {%- set cals = ['calendar.matt', 'calendar.partner', 'calendar.family', 'calendar.birthdays'] -%}
              {%- set ns = namespace(ts=none, allday=true) -%}
              {%- for c in cals -%}
                {%- set st = state_attr(c, 'start_time') -%}
                {%- if st -%}
                  {%- set ts = as_timestamp(st) -%}
                  {%- if ns.ts is none or ts < ns.ts -%}
                    {%- set ns.ts = ts -%}
                    {%- set ns.allday = state_attr(c, 'all_day') -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ts | timestamp_custom('%a %b %-d' ~ ('' if ns.allday else ' • %-I:%M %p')) if ns.ts is not none else '' }}
            icon: mdi:calendar-clock
            icon_color: orange
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: /calendar
            card_mod:
              style: |
                ha-card {
                  background: rgba(255, 255, 255, 0.04) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  border-radius: 20px;
                  margin-bottom: 6px;
                }

      # =========================================================
      # SECTION 3: AREAS & SYSTEMS
      # =========================================================
      - type: grid
        cards:
          - type: heading
            heading: Areas & Systems
            icon: mdi:compass-outline
          - type: horizontal-stack
            cards:
              # BASEMENT AREA CARD (THEATER-AWARE)
              - type: custom:mushroom-template-card
                primary: Basement
                secondary: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    Cinema • {{ states('sensor.theater_mode') | title }}
                  {% elif is_state('binary_sensor.basement_lights_active', 'on') %}
                    Lights On • Active
                  {% else %}
                    Dormant
                  {% endif %}
                icon: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    mdi:theater
                  {% else %}
                    mdi:home-floor-b
                  {% endif %}
                icon_color: >-
                  {% if is_state('binary_sensor.theater_in_use', 'on') %}
                    blue
                  {% elif is_state('binary_sensor.basement_lights_active', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /basement-yaml/basement
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'linear-gradient(135deg, rgba(33, 150, 243, 0.2), rgba(13, 71, 161, 0.1))' if is_state('binary_sensor.theater_in_use', 'on') else ('rgba(255, 193, 7, 0.1)' if is_state('binary_sensor.basement_lights_active', 'on') else 'rgba(255, 255, 255, 0.04)') }} !important;
                      border: 1px solid {{ 'rgba(33, 150, 243, 0.45)' if is_state('binary_sensor.theater_in_use', 'on') else ('rgba(255, 193, 7, 0.3)' if is_state('binary_sensor.basement_lights_active', 'on') else 'rgba(255, 255, 255, 0.08)') }} !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                      transition: all 0.25s ease !important;
                    }
                    ha-card:active { transform: scale(0.95); }

              - type: custom:mushroom-template-card
                primary: Bedroom
                secondary: >-
                  {{ states('light.zigbee_bedroom_lights') | default('Off', true) | title }}
                icon: mdi:bed
                icon_color: blue
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-home2/bedroom
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: History
                secondary: 24h Activity
                icon: mdi:chart-timeline-variant-shimmer
                icon_color: purple
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /activity-log/activity-log
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

              - type: custom:mushroom-template-card
                primary: Telemetry
                secondary: >-
                  {{ states('sensor.system_monitor_processor_use') | round(0, default='—') }}% CPU
                icon: mdi:server-network
                icon_color: teal
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-diagnostics
                  haptic: light
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.04) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Security
                secondary: >-
                  {% set cams = ['camera.front_porch_cam', 'camera.back_deck_cam', 'camera.back_yard_cam'] %}
                  {{ cams | reject('is_state', 'unavailable') | list | length }}/{{ cams | length }} cameras online
                icon: mdi:cctv
                icon_color: >-
                  {% set cams = ['camera.front_porch_cam', 'camera.back_deck_cam', 'camera.back_yard_cam'] %}
                  {{ 'red' if cams | select('is_state', 'unavailable') | list | length > 0 else 'cyan' }}
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: '#security-cams'
                  haptic: light
                card_mod:
                  style: |
                    {% set cams = ['camera.front_porch_cam', 'camera.back_deck_cam', 'camera.back_yard_cam'] %}
                    {% set down = cams | select('is_state', 'unavailable') | list | length > 0 %}
                    ha-card {
                      background: {{ 'rgba(244, 67, 54, 0.12)' if down else 'rgba(0, 188, 212, 0.06)' }} !important;
                      border: 1px solid {{ 'rgba(244, 67, 54, 0.5)' if down else 'rgba(0, 188, 212, 0.2)' }} !important;
                      border-radius: 20px !important;
                      padding: 6px 8px !important;
                    }
                    ha-card:active { transform: scale(0.95); }

          # --- SECURITY CAMERAS LIVE FEED POP-UP MODAL (ON-DEMAND) ---
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#security-cams'
            name: Perimeter Security
            icon: mdi:cctv
            show_header: true
            bg_color: rgba(10, 15, 26, 0.96)
            bg_blur: 24
            shadow_opacity: 0.8
            cards:
              - type: picture-entity
                entity: camera.front_porch_cam
                name: Front Porch
                camera_view: live
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px !important;
                      margin-bottom: 8px !important;
                      background: rgba(255, 255, 255, 0.03) !important;
                      border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    }
              - type: picture-entity
                entity: camera.back_deck_cam
                name: Back Deck
