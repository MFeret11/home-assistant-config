# Trakt: upcoming episodes, season premieres for the basement dashboard, and watch stats.
# The account link (client ID/secret) is set up in the UI, not here.
# Changes to this file need an HA restart.
trakt_tv:
  language: en
  timezone: America/New_York
  sensors:
    upcoming:
      show:
        days_to_fetch: 7
        max_medias: 5
      premiere:          # season premieres and new shows you follow
        days_to_fetch: 90
        max_medias: 5
    stats:
      - movies_watched
      - episodes_watched
      - episodes_minutes
