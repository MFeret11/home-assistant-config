# ==============================================================================
# PACKAGE: COMMUTE & TRANSIT TELEMETRY
# ==============================================================================

rest:
  - resource: "http://127.0.0.1:8000/api/dashboard"
    scan_interval: 30
    sensor:
      - name: "SEPTA Commute"
        value_template: "{{ value_json.overall_status }}"
        json_attributes_path: "$.commute"
        json_attributes:
          - trip_type
          - origin_train
          - origin_line
          - origin_departure_time
          - origin_actual_departure_time
          - origin_track
          - origin_delay_minutes
          - is_cancelled
          - is_stalled
          - stall_minutes
          - walk_time_minutes
          - leave_by_time
          - minutes_until_leave_by
          - leave_now
          - already_departed
          - at_risk
          - delayed
          - connection_station
          - connection_train
          - connection_line
          - connection_departure_time
          - connection_actual_departure_time
          - connection_track
          - connection_delay_minutes
          - connection_is_stalled
          - connection_cancelled
          - transfer_buffer_minutes
          - arrival_time
          - actual_arrival_time
          - total_delay_minutes
          - missed_connection
          - backup_train_departure
          - origin_current_stop
          - origin_delay_text
          - origin_delay_unknown
          - connection_current_stop
          - connection_stall_minutes
          - connection_delay_text
          - connection_delay_unknown
          - planned_connection_cancelled
          - planned_connection_train
          - planned_arrival_time
          - data_stale
          - transfer_fallback
          - preferred_transfer_station
          - service_alerts
          - alerts_unavailable
          # From the commuter's GPS (pyscript/commute_location.py posts it):
          # the train they are on, whether they are home, age of the position.
          - rider_on_train
          - rider_home
          - rider_location_age_minutes

  - resource: "http://127.0.0.1:8000/api/weather"
    scan_interval: 300
    sensor:
      - name: "Commute Weather"
        value_template: "{{ value_json.attire_suggestion }}"
        json_attributes:
          - high_f
          - low_f
          - morning_temp_f
          - evening_temp_f
          - condition
          - needs_umbrella
          - current_temp_f
          - precip_chance
          - commute_warnings
          - weather_stale
          - morning_warning
          - evening_warning

template:
  # Commute cards show on weekdays only; the transit service has no commute
  # data on weekends. Hours sit inside the service's own windows (5-9, 14-19).
  - binary_sensor:
      - name: "Septa Display Window"
        state: "{{ now().weekday() < 5 and now().hour in [6, 7, 16, 17] }}"
      - name: "Drive Display Window"
        state: "{{ now().weekday() < 5 and now().hour == 8 }}"
      - name: "Septa AM Window"
        state: "{{ now().weekday() < 5 and now().hour in [6, 7] }}"
      - name: "Septa PM Window"
        state: "{{ now().weekday() < 5 and now().hour in [16, 17] }}"
      # On while that person is away from home, from the home / away state of
      # the neutral location sensors (made in a private package). The kitchen
      # map shows whoever is away, so the one at home can see where they are.
      - name: "Partner Away"
        unique_id: partner_away
        icon: mdi:map-marker-account
        state: "{{ states('sensor.partner_location') not in ['home', 'unknown', 'unavailable'] }}"
      - name: "Me Away"
        unique_id: me_away
        icon: mdi:map-marker-account
        state: "{{ states('sensor.me_location') not in ['home', 'unknown', 'unavailable'] }}"

  # On from when the commuter leaves work until they're home: the kitchen's
  # train-home card and the tablet's screen follow it, and the transit service
  # is told (pyscript/commute_location.py) so it shows the next train they can
  # make, at any hour. "At work" comes from sensor.partner_location (private
  # package). left_work_at is set once, when that state ends, so a brief
  # "unavailable" while the tracker refreshes doesn't lose the departure, and
  # the flag only turns on after 3 minutes away (GPS jitter at the desk).
  # It ends at home, back at work, at midnight, or 3 hours after leaving.
  - trigger:
      - trigger: state
        entity_id: sensor.partner_location
      - trigger: time_pattern
        minutes: "/1"
    binary_sensor:
      - name: "Partner Heading Home"
        unique_id: partner_heading_home
        icon: mdi:walk
        state: >-
          {% set s = states('sensor.partner_location') %}
          {% set left = this.attributes.get('left_work_at') or '' %}
          {% set left = left | as_datetime(none) if left else none %}
          {% if s in ['At work', 'home'] or left is none %}false
          {% elif s in ['unknown', 'unavailable'] %}{{ this.state == 'on' }}
          {% else %}
            {% set away = (now() - left).total_seconds() %}
            {{ now().weekday() < 5 and left.date() == now().date() and 180 <= away < 3 * 3600 }}
          {% endif %}
        attributes:
          left_work_at: >-
            {% set to = trigger.to_state.state if trigger.platform == 'state' and trigger.to_state else none %}
            {% set from = trigger.from_state.state if trigger.platform == 'state' and trigger.from_state else none %}
            {% if to == 'At work' or states('sensor.partner_location') == 'home' %}
            {% elif from == 'At work' %}{{ now().isoformat() }}
            {% else %}{{ this.attributes.get('left_work_at') or '' }}{% endif %}

  # How urgent the kitchen commute cards look: ok, warn or alert.
  # The card text explains why; these only pick the colour.
  - sensor:
      - name: "Commute AM Severity"
        unique_id: commute_am_severity
        icon: mdi:train
        state: >-
          {% set c = states.sensor.septa_commute.attributes if states.sensor.septa_commute is not none else {} %}
          {% set no_data = c.get('origin_train') is none or states('sensor.septa_commute') in ['unavailable', 'unknown', 'error', 'idle'] %}
          {% set alert = (c.get('service_alerts') or []) | length > 0
             or c.get('leave_now', false) or c.get('is_cancelled', false)
             or c.get('connection_cancelled', false) or c.get('planned_connection_cancelled', false)
             or c.get('missed_connection', false) %}
          {% set warn = no_data
             or c.get('is_stalled', false) or c.get('connection_is_stalled', false)
             or c.get('at_risk', false)
             or c.get('origin_delay_unknown', false) or c.get('connection_delay_unknown', false)
             or (c.get('total_delay_minutes', 0) or 0) > 0 %}
          {{ 'alert' if alert else ('warn' if warn else 'ok') }}

      - name: "Commute PM Severity"
        unique_id: commute_pm_severity
        icon: mdi:train
        state: >-
          {% set c = states.sensor.septa_commute.attributes if states.sensor.septa_commute is not none else {} %}
          {% set delay = c.get('total_delay_minutes', 0) or 0 %}
          {% set no_data = c.get('origin_line') is none or states('sensor.septa_commute') in ['unavailable', 'unknown', 'error', 'idle'] %}
          {% set alert = (c.get('service_alerts') or []) | length > 0
             or c.get('missed_connection', false) or delay >= 10
             or c.get('is_cancelled', false) or c.get('connection_cancelled', false)
             or c.get('planned_connection_cancelled', false) %}
          {% set warn = no_data or delay > 0
             or c.get('at_risk', false)
             or c.get('is_stalled', false) or c.get('connection_is_stalled', false)
             or c.get('origin_delay_unknown', false) or c.get('connection_delay_unknown', false) %}
          {{ 'ok' if c.get('rider_home', false) else ('alert' if alert else ('warn' if warn else 'ok')) }}
