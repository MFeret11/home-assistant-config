# ==============================================================================
# PACKAGE: KITCHEN DISPLAY
# Data for the kitchen tablet dashboard (dashboards/kitchen.yaml). The page shows
# less in the morning rush and more the rest of the day; sensor.kitchen_display_mode
# picks which. Card markup lives in custom_templates/kitchen.jinja.
# ==============================================================================

template:
  # Weather alert banner: on while there is an alert you haven't dismissed.
  # The key is the alert text plus the alert count, so the banner comes back
  # by itself when the alert changes (say, a watch becomes a warning) or
  # another alert is added. pyscript.weather_alert_dismiss (pyscript/weather_alert.py)
  # saves the key attribute as pyscript.weather_alert_dismissed.
  - binary_sensor:
      - name: Weather Alert Showing
        unique_id: weather_alert_showing
        icon: mdi:alert
        state: >-
          {% set key = (states('sensor.weather_alert') ~ ' | ' ~ states('sensor.weather_alert_count'))[:255] %}
          {{ states('sensor.weather_alert_count') | int(0) > 0
             and key != states('pyscript.weather_alert_dismissed') }}
        attributes:
          key: >-
            {{ (states('sensor.weather_alert') ~ ' | ' ~ states('sensor.weather_alert_count'))[:255] }}

  # morning: weekdays 6-9 AM, only commute, weather and today's events.
  # day: everything else.
  - sensor:
      - name: Kitchen Display Mode
        unique_id: kitchen_display_mode
        icon: mdi:tablet-dashboard
        state: "{{ 'morning' if now().weekday() < 5 and 6 <= now().hour < 9 else 'day' }}"

  - binary_sensor:
      # Train-home card: on once the commuter leaves work
      # (binary_sensor.partner_heading_home), whatever the time, until they're
      # home. Without a live location (tracker unavailable or silent for 30
      # minutes) it falls back to the fixed hours: 4-6 PM, or from 2 PM on
      # work-from-home days.
      - name: Kitchen Show PM Commute
        unique_id: kitchen_show_pm_commute
        icon: mdi:train
        state: >-
          {% set home = state_attr('sensor.septa_commute', 'rider_home')
             or is_state('sensor.partner_location', 'home') %}
          {% set seen = state_attr('sensor.partner_location', 'last_seen') | as_datetime(none) %}
          {% set live = states('sensor.partner_location') not in ['unknown', 'unavailable']
             and seen is not none and (now() - seen).total_seconds() < 1800 %}
          {% set fixed_hours = is_state('binary_sensor.septa_pm_window', 'on')
             or (is_state('binary_sensor.working_from_home', 'on')
                 and now().weekday() < 5 and now().hour in [14, 15]) %}
          {{ not home and (is_state('binary_sensor.partner_heading_home', 'on')
             or (not live and fixed_hours)) }}

      # Mornings: the tablet's screen stays on (pyscript/kitchen_tablet.py)
      # through the weekday morning layout, 6-9 AM, whether or not anyone
      # commutes that day, and 8-11 AM on weekends.
      - name: Kitchen Morning Wake
        unique_id: kitchen_morning_wake
        icon: mdi:tablet
        state: >-
          {{ is_state('sensor.kitchen_display_mode', 'morning')
             or (now().weekday() >= 5 and 8 <= now().hour < 11) }}

      # Evenings, 4-8 PM every day: the screen stays on again (the train-home
      # card, then dinner). Between the morning and evening windows it is off.
      - name: Kitchen Evening Wake
        unique_id: kitchen_evening_wake
        icon: mdi:tablet
        state: "{{ 16 <= now().hour < 20 }}"

  # Weather for the kitchen card. Forecasts aren't entity attributes any more,
  # so fetch them on a timer and keep only the fields the card uses.
  - trigger:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.whole_house_national_weather_service_kphl
        data:
          type: hourly
        response_variable: hourly
      - action: weather.get_forecasts
        target:
          entity_id: weather.whole_house_national_weather_service_kphl
        data:
          type: twice_daily
        response_variable: twice
    sensor:
      - name: Kitchen Weather
        unique_id: kitchen_weather
        icon: mdi:weather-partly-cloudy
        state: "{{ now().isoformat() }}"
        attributes:
          # Next 16 hours: time label, temperature, condition, rain chance,
          # dew point and wind speed (none when NWS leaves them out).
          hourly: >-
            {% set fc = hourly['weather.whole_house_national_weather_service_kphl'].forecast %}
            {% set ns = namespace(out=[]) %}
            {% for h in fc[:16] %}
              {% set ns.out = ns.out + [{
                't': (as_datetime(h.datetime) | as_local).strftime('%-I %p'),
                'hour': (as_datetime(h.datetime) | as_local).hour,
                'temp': h.temperature | round(0) | int,
                'cond': h.condition,
                'rain': h.precipitation_probability | default(0, true) | int,
                'dew': (h.dew_point | round(0) | int) if h.dew_point is number else none,
                'wind': (h.wind_speed | round(0) | int) if h.wind_speed is number else none }] %}
            {% endfor %}
            {{ ns.out }}
          # Next 5 days: daytime high, the following night's low, condition, rain chance.
          daily: >-
            {% set fc = twice['weather.whole_house_national_weather_service_kphl'].forecast %}
            {% set ns = namespace(out=[]) %}
            {% for d in fc %}
              {% if d.is_daytime and ns.out | length < 5 %}
                {% set nxt = fc[loop.index] if loop.index < fc | length else none %}
                {% set ns.out = ns.out + [{
                  'day': (as_datetime(d.datetime) | as_local).strftime('%a'),
                  'hi': d.temperature | round(0) | int,
                  'lo': (nxt.temperature | round(0) | int) if nxt is not none and not nxt.is_daytime else none,
                  'cond': d.condition,
                  'rain': d.precipitation_probability | default(0, true) | int }] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          # Today's high (none once NWS has moved on to "tonight") and tonight's low.
          today_hi: >-
            {% set fc = twice['weather.whole_house_national_weather_service_kphl'].forecast %}
            {{ (fc[0].temperature | round(0) | int) if fc and fc[0].is_daytime else none }}
          tonight_lo: >-
            {% set fc = twice['weather.whole_house_national_weather_service_kphl'].forecast %}
            {% set night = fc[:2] | rejectattr('is_daytime') | list %}
            {{ (night[0].temperature | round(0) | int) if night else none }}

  # Today's events from the household calendars, for the morning line. On
  # Fridays it also fetches Saturday and Sunday for the weekend card
  # (dashboards/components/shared/weekend_events.yaml).
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    action:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.matt
            - calendar.partner
            - calendar.family
            - calendar.birthdays
        data:
          start_date_time: "{{ today_at('00:00').isoformat() }}"
          end_date_time: >-
            {{ (today_at('00:00') + timedelta(days=3 if now().weekday() == 4 else 1)).isoformat() }}
        response_variable: cal
      # The next 30 days, only to find countdowns (below).
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.matt
            - calendar.partner
            - calendar.family
            - calendar.birthdays
        data:
          start_date_time: "{{ (today_at('00:00') + timedelta(days=1)).isoformat() }}"
          duration:
            days: 30
        response_variable: ahead
      # Countdowns: an event whose description says "countdown:7" shows as
      # "in N days" on the morning card for the 7 days before it starts.
      # Only the next 30 days are looked at, so anything above 30 acts as 30.
      # A repeating event counts down only to its next date.
      - variables:
          countdowns: >-
            {% set who = {'calendar.matt': 'matt', 'calendar.partner': 'partner',
                          'calendar.family': 'family', 'calendar.birthdays': 'birthday'} %}
            {% set today = now().date() %}
            {% set ns = namespace(out=[]) %}
            {% for k, v in ahead.items() %}
              {% for e in v.events %}
                {% set n = (e.get('description') or '') | regex_findall('countdown:\s*(\d+)', true) %}
                {% if n %}
                  {% set start = strptime(e.start[:10], '%Y-%m-%d').date() if 'T' not in e.start
                                 else (as_datetime(e.start) | as_local).date() %}
                  {% set days = (start - today).days %}
                  {% if 0 < days <= n[0] | int %}
                    {% set ns.out = ns.out + [{
                      'title': e.summary | truncate(40, true, '…', 0),
                      'days': days,
                      'day': start.strftime('%a'),
                      'who': who.get(k, '') }] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% set nd = namespace(out=[], seen=[]) %}
            {% for c in ns.out | sort(attribute='days') if c.title not in nd.seen %}
              {% set nd.out = nd.out + [c] %}
              {% set nd.seen = nd.seen + [c.title] %}
            {% endfor %}
            {{ nd.out }}
      # One list per day: [today, Saturday, Sunday] on Fridays, [today] otherwise.
      # A timed event goes on the day it starts (or today, if it started
      # earlier); an all-day event goes on every day it covers. Sorted by start,
      # all-day events first. 'who' is the calendar's key.
      - variables:
          days: >-
            {% set who = {'calendar.matt': 'matt', 'calendar.partner': 'partner',
                          'calendar.family': 'family', 'calendar.birthdays': 'birthday'} %}
            {% set n = 3 if now().weekday() == 4 else 1 %}
            {% set ns = namespace(out=[]) %}
            {% for i in range(n) %}
              {% set d = (today_at('00:00') + timedelta(days=i)).date() | string %}
              {% set first = i == 0 %}
              {% set nd = namespace(evs=[]) %}
              {% for k, v in cal.items() %}
                {% for e in v.events %}
                  {% set all_day = 'T' not in e.start %}
                  {% if all_day %}
                    {% set hit = e.start[:10] <= d < e.end[:10] %}
                  {% else %}
                    {% set sd = (as_datetime(e.start) | as_local).date() | string %}
                    {% set hit = sd == d or (first and sd < d) %}
                  {% endif %}
                  {% if hit %}
                    {% set nd.evs = nd.evs + [{
                      'title': e.summary | truncate(60, true, '…', 0),
                      'time': '' if all_day else (as_datetime(e.start) | as_local).strftime('%-I:%M %p'),
                      'sort': '00:00' if all_day else (as_datetime(e.start) | as_local).strftime('%H:%M'),
                      'who': who.get(k, '') }] %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {% set ns.out = ns.out + [nd.evs | sort(attribute='sort') | list] %}
            {% endfor %}
            {{ ns.out }}
    sensor:
      - name: Kitchen Today Events
        unique_id: kitchen_today_events
        icon: mdi:calendar-today
        state: "{{ days[0] | length }}"
        attributes:
          events: "{{ days[0] }}"
          # [{'title', 'days', 'day', 'who'}], soonest first; see "Countdowns" above.
          countdowns: "{{ countdowns }}"
          # Fridays only: [{'day': 'Saturday', 'events': [...]}, {'day': 'Sunday', ...}].
          weekend: >-
            {% set names = ['Saturday', 'Sunday'] %}
            {{ [{'day': names[0], 'events': days[1]}, {'day': names[1], 'events': days[2]}]
               if days | length == 3 else [] }}

  # On while the work remote desktop has been seen on the PC today (weekdays).
  # Matches only the generic viewer window name. Clears at midnight.
  - trigger:
      - trigger: state
        entity_id: sensor.desktop_rspn8nu_activewindow
      - trigger: time
        at: "00:00:00"
    binary_sensor:
      - name: Working From Home
        unique_id: working_from_home
        icon: mdi:home-account
        state: >-
          {% if trigger.platform == 'time' or now().weekday() >= 5 %}
            false
          {% elif 'Desktop Viewer' in states('sensor.desktop_rspn8nu_activewindow') %}
            true
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}

# Active National Weather Service alerts for home (watches, warnings, advisories).
# Location comes from zone.home, so no coordinates live in this file.
rest:
  - resource_template: >-
      https://api.weather.gov/alerts/active?point={{ state_attr('zone.home', 'latitude') | round(4) }},{{ state_attr('zone.home', 'longitude') | round(4) }}
    headers:
      User-Agent: "home-assistant-kitchen-dashboard"
      Accept: "application/geo+json"
    scan_interval: 300
    timeout: 15
    sensor:
      - name: Weather Alert Count
        unique_id: weather_alert_count
        icon: mdi:alert
        value_template: "{{ value_json.features | length }}"
      # Most severe alert first. Headline is truncated to fit a state.
      - name: Weather Alert
        unique_id: weather_alert
        icon: mdi:alert
        value_template: >-
          {% set rank = {'Extreme': 0, 'Severe': 1, 'Moderate': 2, 'Minor': 3} %}
          {% set ns = namespace(best=none, r=9) %}
          {% for f in value_json.features %}
            {% set r = rank.get(f.properties.severity, 4) %}
            {% if r < ns.r %}{% set ns.best = f.properties %}{% set ns.r = r %}{% endif %}
          {% endfor %}
          {{ (ns.best.event ~ ' until ' ~ (as_datetime(ns.best.ends or ns.best.expires) | as_local).strftime('%a %-I %p')) | truncate(250, true, '…', 0) if ns.best else 'none' }}
